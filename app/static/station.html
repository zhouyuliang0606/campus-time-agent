<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园时间管家 · 驿站/商户端</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fb; color: #1f2733;
    }
    /* 三栏外壳之后 header 与 .wrap 都不存在了，它们那三条 CSS 一并删（留孤儿就是"改一半"的现场） */

    /* 客服人格卡片：显示管理后台配的人设，让人一眼看到"人格是活的" */
    .persona {
      background: #fff; border-radius: 12px; padding: 14px 16px;
      border-left: 5px solid #17b8a6; box-shadow: 0 4px 16px rgba(40,60,120,.08);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .persona .left { flex: 1; }
    .persona .nm { font-size: 15px; font-weight: 600; }
    .persona .rl { font-size: 13px; color: #6a7388; margin: 2px 0 6px; }
    .persona .tm { font-size: 12px; color: #4a5366; }
    .persona .tm div { margin: 3px 0; }
    .persona .tm b { color: #17b8a6; }
    .refresh {
      border: 1px solid #17b8a6; background: #fff; color: #17b8a6;
      border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .refresh:hover { background: #e8f8f6; }
    .persona a { font-size: 12px; color: #6a7388; display: inline-block; margin-top: 6px; }

    .hint { font-size: 13px; color: #6a7388; margin: 14px 2px 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip {
      background: #fff; border: 1px solid #d8def0; border-radius: 16px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: #17b8a6;
    }
    .chip:hover { background: #e8f8f6; }
    .chip.warn { color: #e08c2a; border-color: #f3d9b0; }
    .chip.warn:hover { background: #fff7ec; }

    #log {
      background: #fff; border-radius: 12px; padding: 16px;
      /* 三栏外壳里它自己滚：flex 撑满「对话」这块剩下的宽度，
         原来那句 max-height:440px 撤掉（外壳已经自带滚动，两处都限高就变成套两层滚动条） */
      flex: 1; min-height: 0; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(40,60,120,.08);
    }
    .msg { margin: 10px 0; }
    .msg .who { font-size: 12px; color: #8a93a6; margin-bottom: 3px; }
    .msg .bubble {
      display: inline-block; padding: 10px 14px; border-radius: 12px;
      line-height: 1.55; white-space: pre-wrap; max-width: 92%;
    }
    .user .bubble { background: #17b8a6; color: #fff; border-bottom-right-radius: 2px; }
    .bot .bubble { background: #f0f3fa; color: #1f2733; border-bottom-left-radius: 2px; }
    .sys .bubble { background: #fff7e6; color: #8a6d3b; border: 1px dashed #ffd591; font-size: 13px; }
    .trace {
      margin-top: 6px; font-size: 12px; color: #6a7388;
      background: #fafbff; border: 1px dashed #d8def0; border-radius: 8px;
      padding: 8px 10px; white-space: pre-wrap;
    }
    .tag { display:inline-block; font-size:11px; background:#e8f8f6; color:#17b8a6; border-radius:6px; padding:1px 6px; margin-left:6px;}
    .inputbar { display: flex; gap: 10px; margin-top: 14px; }
    .inputbar input {
      flex: 1; padding: 12px 14px; border: 1px solid #d8def0; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    .inputbar button {
      padding: 0 22px; border: none; border-radius: 10px; cursor: pointer;
      background: #17b8a6; color: #fff; font-size: 14px;
    }
    .inputbar button:disabled { opacity: .6; cursor: not-allowed; }
    /* 回形针：上传资料（比如一批待取清单）给客服读 */
    .attach {
      padding: 0 14px; border: 1px solid #d8def0; background: #fff; color: #17b8a6;
      border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .attach:hover { background: #e8f8f6; }
    /* 待处理问题（学生报的快递/外卖问题流到驿站，#18 单子 2） */
    .wo { background: #fff; border: 1px solid #e6ebf5; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .woHead { font-size: 14px; font-weight: 600; color: #1f2733; }
    .woHead .cnt { font-weight: 400; color: #6a7388; font-size: 12px; margin-left: 6px; }
    .woItem { display: flex; gap: 10px; align-items: flex-start; border-top: 1px dashed #e6ebf5; padding: 9px 0; font-size: 13px; }
    .woItem .body { flex: 1; }
    .woItem .kind { font-weight: 600; }
    .woItem .meta { color: #8a93a5; font-size: 11px; margin-top: 2px; }
    /* 归属（#37）：驿站看的就是"该找谁"，这一枚标记比编号有用；老单显示「未登记」 */
    .woItem .who { margin-right: 6px; color: #17b8a6; }
    .woItem .st { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: #fff1f0; color: #cf1322; }
    .woItem .st.doing { background: #fff7e6; color: #d46b08; }
    .woItem .st.done { background: #f6ffed; color: #389e0d; }
    .woItem button { border: 1px solid #d8def0; background: #fff; color: #17b8a6; border-radius: 7px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
    .woItem button:hover { background: #e8f8f6; }
    .woEmpty { color: #8a93a5; font-size: 12px; padding-top: 8px; }
    /* 低代码新增服务（#18 单子 3） */
    .svcAdd { display: flex; gap: 8px; margin-top: 10px; }
    .svcAdd input { flex: 1; padding: 9px 11px; border: 1px solid #d8def0; border-radius: 9px; font-size: 13px; }
    .svcAdd button { padding: 0 16px; border: none; border-radius: 9px; background: #17b8a6; color: #fff; cursor: pointer; font-size: 13px; }
    .svcAdd button:disabled { opacity: .6; cursor: progress; }
    .svc { border-top: 1px dashed #e6ebf5; padding: 9px 0; font-size: 13px; }
    .svc .nm { font-weight: 600; }
    .svc .pill { display: inline-block; font-size: 11px; background: #e8f8f6; color: #17b8a6; border-radius: 6px; padding: 1px 6px; margin: 0 4px 3px 0; }
    .svc .tb { font-size: 11px; color: #8a93a5; }
    /* 学生登记条目：这是店员要照着办的活，不是这块卡的附属说明 ——
       原来比表单还小一档（12px + 灰），录屏和打印都看不清（2026-10-21 用户真机：「太小了」）。
       改成与表单同档 13px，只把**计数那一行**留在灰一档，正文行颜色压到近黑。 */
    .svc .recs { margin-top: 8px; font-size: 13px; color: #2f3846; }
    .svc .recHead { color: #8a93a5; margin-bottom: 2px; font-size: 12px; }
    .svc .recRow {
      background: #fafbff; border: 1px dashed #e6ebf5; border-radius: 7px;
      padding: 6px 9px; margin-bottom: 4px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-all;
    }
    .svc form { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .svc form input { padding: 6px 8px; border: 1px solid #d8def0; border-radius: 7px; font-size: 12px; width: 150px; }
    .svc form button { padding: 6px 12px; border: none; border-radius: 7px; background: #17b8a6; color: #fff; font-size: 12px; cursor: pointer; }
    .svc .last { font-size: 12px; color: #389e0d; margin-top: 5px; }

    /* ============ 三栏外壳（抄 student.html 的结构与命名，配色走驿站青绿，不抄它那套蓝） ============ */
    .shell { display: flex; height: 100vh; overflow: hidden; }
    .sidebar {
      width: 224px; flex: none; background: #fff; border-right: 1px solid #eef0f6;
      display: flex; flex-direction: column; padding: 12px; gap: 4px;
      height: 100vh; overflow-y: auto;
    }
    .sb-brand {
      display: flex; align-items: center; gap: 10px; padding: 10px;
      border-radius: 12px; background: linear-gradient(135deg, #17b8a6, #2f9e6f);
      color: #fff; margin-bottom: 10px;
    }
    .sb-brand .t { font-size: 14px; font-weight: 600; }
    .sb-brand .s { font-size: 11px; opacity: .9; }
    .sb-nav { display: flex; flex-direction: column; gap: 2px; }
    .sb-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 12px;
      border-radius: 10px; cursor: pointer; font-size: 14px; color: #4a5366;
      user-select: none; border: 1px solid transparent;
    }
    .sb-item:hover { background: #f4f6fb; }
    .sb-item.active { background: #e8f8f6; color: #0e8f80; font-weight: 600; border-color: #bfe9e3; }
    .sb-item .ico { width: 18px; text-align: center; font-size: 16px; }
    /* 未结角标：用站内「待处理」同一个红（#fff1f0/#cf1322），不新造一套颜色 */
    .sb-num {
      display: none; margin-left: auto; font-size: 11px; line-height: 16px;
      background: #fff1f0; color: #cf1322; border-radius: 9px; padding: 0 7px;
    }
    .sb-num.show { display: inline-block; }
    .sb-foot { margin-top: auto; font-size: 11px; color: #aab1c2; padding-left: 6px; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid #eef0f6; background: #fff;
    }
    .topbar .t { font-size: 15px; font-weight: 600; color: #1f2733; }
    .topbar .grow { flex: 1; }
    .tb-link { font-size: 13px; color: #0e8f80; text-decoration: none; background: #e8f8f6; padding: 5px 12px; border-radius: 8px; }
    .tb-link:hover { background: #d9f3ef; }
    .stage { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }

    /* 视图切换：只靠 display 切，DOM 全程不重建（切走再切回，正在填的表单与临时建议都还在） */
    .nav-view { display: none; }
    .nav-view.active { display: block; }
    /* 「对话」这块自己占满高度并**在 #log 内部滚**：
       施工单给的 `#log { max-height:none }` 让整块内容往外撑，那样页面就又要滚了 ——
       它自己的验收第 3 条（#log.scrollHeight > clientHeight 且页面不滚）在改法下不成立，
       所以这里改成 flex 撑满 + #log 自己滚（实测值见本轮快照）。 */
    #view-chat.active { display: flex; flex-direction: column; height: 100%; }
    .composer { border-top: 1px solid #eef0f6; background: #fff; padding: 10px 16px 14px; }
    .inputbar { margin-top: 0; }
    /* 输入区只在「对话」视图出现：其余三块纯查看，摆个输入框只会让人以为那块也能聊天 */
    body.no-chatbox .composer { display: none !important; }

    /* 清空按钮：跟 📎 同尺寸同气质，不抢【发送】的注意力 */
    .clear {
      padding: 0 12px; border: 1px solid #d8def0; background: #fff; color: #8a6d3b;
      border-radius: 10px; cursor: pointer; font-size: 12.5px; white-space: nowrap;
    }
    .clear:hover { background: #fff7ec; border-color: #f3d9b0; }

    /* 确认框（自绘）：不用原生 confirm() —— 演示时连点几次会被浏览器拦「阻止此页面创建更多对话框」 */
    .mask { display: none; position: fixed; inset: 0; background: rgba(20,26,45,.45); z-index: 200; align-items: center; justify-content: center; }
    .mask.show { display: flex; }
    .dlg { background: #fff; border-radius: 14px; width: min(420px, 92vw); padding: 18px; box-shadow: 0 20px 60px rgba(20,26,45,.28); }
    .dlg-head { font-size: 15px; font-weight: 600; color: #1f2733; margin-bottom: 8px; }
    .dlg-body { font-size: 13.5px; color: #4a5366; line-height: 1.7; }
    .dlg-warn { background: #fff7e6; border: 1px dashed #ffd591; border-radius: 9px; padding: 9px 11px; font-size: 12.5px; color: #8a6d3b; margin-top: 8px; }
    .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .dlg-btn { border: none; border-radius: 9px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
    .dlg-btn.ghost { background: #f0f3fa; color: #4a5366; }
    .dlg-btn.danger { background: #e24b4a; color: #fff; }

    /* 窄屏（笔记本演示也可能被窗口挤）：侧栏收成 64px 只留图标，抄 student.html 的做法。
       ⚠️ 收文字那一句必须**放过角标**：`.sb-item span:not(.ico)` 的特异度(0,2,1)比 `.sb-num.show`(0,2,0)高，
          照施工单原样写，窄屏下那颗未结红点会被一起 display:none 掉 ——
          而"切到别的视图也看得见有几条没处理"正是这次挪进左栏后要补的账（真机 529px 实测抓到）。 */
    @media (max-width: 720px) {
      .sidebar { width: 64px; padding: 10px 8px; }
      .sb-brand .txt, .sb-item span:not(.ico):not(.sb-num), .sb-foot { display: none; }
      .sb-item { justify-content: center; position: relative; }
      .sb-num.show { display: inline-block; position: absolute; top: 3px; right: 2px; margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- 三栏外壳（#25）：左栏点开哪块、中间只显示哪块；正文只在中间滚，输入框钉在底下。
       ⚠️ 里面这些 id 一个都不许改 —— 后端逻辑是 getElementById 硬绑的，改 id 等于把功能删了：
       #personaBox #refreshPersona #woList #woCount #refreshWo #svcList #svcCount #refreshSvc
       #svcIdea #svcGo #chips #log #file #attach #text #send -->
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <span style="font-size:18px;">🏪</span>
        <div class="txt">
          <div class="t">驿站/商户端</div>
          <div class="s">校园时间管家</div>
        </div>
      </div>
      <nav class="sb-nav" id="sbNav">
        <div class="sb-item active" data-nav="chat"><span class="ico">💬</span>对话</div>
        <div class="sb-item" data-nav="wo"><span class="ico">🛠️</span><span class="lbl">待处理问题</span><span class="sb-num" id="woNum"></span></div>
        <div class="sb-item" data-nav="svc"><span class="ico">🧩</span><span class="lbl">服务与登记</span></div>
        <div class="sb-item" data-nav="persona"><span class="ico">🎭</span><span class="lbl">客服人格</span></div>
      </nav>
      <div class="sb-foot">校园时间管家 · 驿站端</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="t" id="navTitle">对话</div>
        <span class="grow"></span>
        <a class="tb-link" href="/">← 返回登录</a>
      </div>

      <div class="stage">
        <!-- ① 对话：快捷操作 + 对话流 -->
        <div id="view-chat" class="nav-view active">
          <div class="hint">用自定义人格回复咨询 · 主动推送取件提醒与滞留预警。点下面的快捷操作让客服干活，或直接提问。</div>
          <div class="chips" id="chips"></div>
          <div id="log">
            <div class="msg bot">
              <div class="who">客服</div>
              <div class="bubble">你好，我是这里的 AI 客服 👋 我可以查台账帮你答复同学，也能主动给还没取件的同学发提醒。</div>
            </div>
          </div>
        </div>

        <!-- ② 待处理问题（#18 单子 2）：原样搬进来，只换容器 -->
        <div id="view-wo" class="nav-view">
          <div class="wo">
            <div class="woHead">🛠️ 待处理问题
              <span class="cnt" id="woCount">加载中…</span>
              <button class="refresh" id="refreshWo" style="float:right;font-size:12px;">刷新</button>
            </div>
            <div id="woList"><div class="woEmpty">正在读台账…</div></div>
          </div>
        </div>

        <!-- ③ 服务与登记（低代码 #18 单子 3 + 登记条目 #24 决策① + 状态 #27）：原样搬进来 -->
        <div id="view-svc" class="nav-view">
          <div class="wo">
            <div class="woHead">🧩 服务（可低代码新增）
              <span class="cnt" id="svcCount">加载中…</span>
              <button class="refresh" id="refreshSvc" style="float:right;font-size:12px;">刷新</button>
            </div>
            <div class="svcAdd">
              <input id="svcIdea" placeholder="说一句话就行，例如：加一个失物招领，学生丢了饭卡可以登记" />
              <button id="svcGo">生成服务</button>
            </div>
            <div id="svcList"><div class="woEmpty">正在读服务清单…</div></div>
          </div>
        </div>

        <!-- ④ 客服人格：从首屏那张大卡降成一颗按钮的内容，块本身一个字没改 -->
        <div id="view-persona" class="nav-view">
          <div class="persona">
            <div class="left" id="personaBox"><div class="nm">加载中…</div></div>
            <div><button class="refresh" id="refreshPersona">刷新人格</button></div>
          </div>
        </div>
      </div><!-- /stage -->

      <!-- 输入区钉在底部：只有「对话」视图用它（其余视图 body 带 no-chatbox，整块隐藏） -->
      <div class="composer">
        <div class="inputbar">
          <input type="file" id="file" style="display:none;" />
          <button class="attach" id="attach" title="上传资料给客服读">📎</button>
          <button class="clear" id="clearChat" title="清空对话记录（左栏台账一条不动）">🗑 清空</button>
          <input id="text" placeholder="问点什么，或让我写提醒文案…" />
          <button id="send">发送</button>
        </div>
      </div>
    </main>
  </div><!-- /shell -->

  <!-- 清空前问一句（自绘，不用原生 confirm：演示时连点几次会被浏览器拦"阻止此页面创建更多对话框"） -->
  <div id="clearMask" class="mask">
    <div class="dlg" role="dialog" aria-modal="true">
      <div class="dlg-head">🗑 清空对话记录</div>
      <div class="dlg-body">
        <p id="clearSummary" style="margin:0 0 8px;line-height:1.6;"></p>
        <div class="dlg-warn">
          删掉的只是<b>屏幕上这段聊天记录</b>，清完从新的一段开始。<br />
          <b>台账不受影响</b>：待处理问题、服务登记条目、快递数据一条都不会变。
        </div>
      </div>
      <div class="dlg-foot">
        <button class="dlg-btn ghost" id="clearCancel">取消</button>
        <button class="dlg-btn danger" id="clearOk">清空记录</button>
      </div>
    </div>
  </div>

  <!-- #39：通用确认框（自绘）。删除服务 / 删除登记记录都走它，不用原生 confirm：
       这一页 182 行那条注释就是理由 —— 连点几次会被浏览器拦「阻止此页面创建更多对话框」，
       那时"点删除没反应"会被当成前端坏了去查。 -->
  <div id="confirmMask" class="mask">
    <div class="dlg" role="dialog" aria-modal="true">
      <div class="dlg-head" id="cfHead"></div>
      <div class="dlg-body">
        <p id="cfBody" style="margin:0;line-height:1.6;"></p>
        <div class="dlg-warn" id="cfWarn" style="display:none;"></div>
      </div>
      <div class="dlg-foot">
        <button class="dlg-btn ghost" id="cfCancel">取消</button>
        <button class="dlg-btn danger" id="cfOk">确定</button>
      </div>
    </div>
  </div>

  <script src="/static/esc.js"></script>
  <script>
    // 快捷操作：前两个是"主动推送"，后面是常见咨询
    // 提示词都故意写成让 Agent 去调工具，这样页面上能看到它真的读了台账
    const CHIPS = [
      { t: "📦 列出还没取走的快递", q: "现在有哪些快递还没取走？按待取和滞留分开说明", cls: "" },
      { t: "🔔 写一条取件提醒", q: "用你的人设语气，给还没取件的同学写一条取件提醒，附上每个人的取件码", cls: "" },
      { t: "⚠️ 滞留件预警", q: "有哪些快递滞留超过 3 天了？用你的人设语气写一条滞留预警提醒", cls: "warn" },
      { t: "🔍 查取件码 B-5678", q: "帮我查一下取件码 B-5678 是什么东西", cls: "" },
      { t: "🎭 自我介绍一下", q: "用你自己的人设语气自我介绍一下，说说你是谁、说话什么风格", cls: "" },
    ];

    const log = document.getElementById("log");
    const text = document.getElementById("text");
    const send = document.getElementById("send");

    // ---------- 渲染快捷操作按钮（一份实现，清空后要复原、上传后要换掉，都走这里） ----------
    function renderChips(list) {
      const box = document.getElementById("chips");
      box.innerHTML = "";

        const el = document.createElement("div");

        el.addEventListener("click", () => sendMsg(c.q));
        box.appendChild(el);
      });

    renderChips(CHIPS);

    // ---------- 三栏外壳：左栏点开哪块，中间就只显示哪块（只用 display 切，DOM 不重建） ----------
    // 因为不重建，所以：① 上传后临时换成的那 3 条建议问题切走再切回**还在**；
    // ② 「服务与登记」里正在填的表单不会被切视图抹掉（那两条轮询防抖逻辑照旧生效）。
    const NAV_TITLE = { chat: "对话", wo: "待处理问题", svc: "服务与登记", persona: "客服人格" };

    function switchNav(view) {
      document.body.classList.toggle("no-chatbox", view !== "chat");
      document.querySelectorAll(".nav-view").forEach(v => v.classList.remove("active"));
      const nv = document.getElementById("view-" + view);

      const t = document.getElementById("navTitle");
      if (t) t.textContent = NAV_TITLE[view] || "对话";
      // 进哪块就现拉一次，别让人对着上一分钟的数据看（5 秒轮询照旧在跑，这里只是"立刻刷一下"）
      if (view === "wo") loadWorkorders();
      else if (view === "svc") svcTick();
      else if (view === "persona") loadPersona();
    }

    document.getElementById("sbNav").addEventListener("click", e => {
      const item = e.target.closest(".sb-item");
      if (item) switchNav(item.dataset.nav);
    });

    switchNav("chat");   // 开场停在对话（上报靠左栏那颗角标兜底）

    // ---------- 加载并展示当前客服人格 ----------
    // 数据来源：管理后台「客服人格配置」，存 persona.json
    // 每次对话后端都会重新读一次人格，所以管理员改完不用重启服务
    async function loadPersona() {
      try {
        const data = await (await fetch("/api/persona")).json();
        const p = data.persona;
        document.getElementById("personaBox").innerHTML = `
          <div class="nm">🎭 当前客服人格：${esc(p.name || "未命名")}<span class="tag">驿站/商户端</span></div>
          <div class="rl">${esc(p.role || "（未设置角色定位）")}</div>
          <div class="tm">
            <div><b>语气：</b>${esc(p.tone || "（未设置）")}</div>
            <div><b>准则：</b>${esc(p.rules || "（未设置）")}</div>
            <a href="/admin">← 去管理控制台改人设</a>
          </div>`;
      } catch (e) {
        document.getElementById("personaBox").innerHTML = '<div class="nm">人格加载失败</div>';
      }
    }
    document.getElementById("refreshPersona").addEventListener("click", () => {
      loadPersona();
      // 在系统消息里留一条痕迹，演示时能看出"刚刷新过"
      addMsg("系统", "已重新读取客服人格配置（管理员刚改的人设立即生效，无需重启）", "sys");
    });

    // ---------- 待处理问题（学生确认上报的快递/外卖问题，#18 单子 2） ----------
    // 数据来自 /api/station/workorders（演示级不挂口令，理由与限制写在 main.py 那一段注释里）。
    // 轮询 5000ms —— 跟管理台 loadMessages / loadWorkOrders 那两条同一个节奏（admin.html:588-590 实测就是 5000），
    // 不是拍的：两端节奏不一致会出现"管理端已看到、驿站还空着"那种演示事故。
    const WO_NEXT = { "待处理": "处理中", "处理中": "已解决", "已解决": "待处理" };

    function woCls(s) {
      return s === "已解决" ? "st done" : (s === "处理中" ? "st doing" : "st");
    }

    // 一次 HTTP 调用没成，把原因拼成人话（#28：非 2xx 时服务端回的是 detail，或者干脆是网关的 HTML 错误页，
    // 里面**没有 error 字段**，只看 r.error 就会把失败当成功 —— 管理端【归档】"点了没反应还写着已归档 1 条"就是这么来的）。
    // 这里只算"原因"这一句，摆到哪儿仍由各自的动作点决定：这一页没有统一的 fetch 包装，本单也不抽。
    function httpFailReason(resp, body) {
      const d = (body && (body.detail || body.error)) || "";
      return "HTTP " + resp.status + (d ? "：" + d : "") + (resp.status === 404
        ? "（接口不存在 —— 多半是服务还在跑旧代码，重启一次再试）" : "");
    }

    // 驿站端固定一段会话（#25 S2 → #30，2026-10-17 用户澄清：「驿站是店员，学生通过自己 ai 给驿站发消息」
    // ⇒ 那台机器上只有一个店员，"上一位同学的提问带到下一位"这个顾虑不存在了，可以固定了）。
    // 固定之后客服才有跨轮记忆，`sessions.json` 也不再一轮攒一条（改前实测 657 个会话里 580 个是随机 id）。
    // ⚠️ 用 **sessionStorage** 而不是学生端那个 localStorage：这台机器是店员的 ——
    //   · 关窗 = 这次值班结束，天然该重开一段；localStorage 会把上一班的上下文递给下一班；
    //   · 柜台常开两三个标签，localStorage 同源共享会把几个窗口的对话串成一段；
    //   · 同标签内按 F5 不丢，所以手滑刷新不会把刚说的忘了。
    const STATION_SID_KEY = "campustime_station_session";
    function newStationSid() { return "st" + Math.random().toString(16).slice(2, 12); }
    function stationSid() {
      let s = sessionStorage.getItem(STATION_SID_KEY);
      if (!s) { s = newStationSid(); sessionStorage.setItem(STATION_SID_KEY, s); }
      return s;
    }

    let woSig = null;    // 上一次真正渲染进 DOM 的清单（同 svcSig，见 #18 单子 3 那条坑）
    let woBusy = false;  // 有一条改状态的请求在飞

    // 「共 N 条，未结 M 条」+ 左栏角标：一个判断只写一处。
    // （原来这句在早退分支和正常分支各抄了一份，加角标就会变成三份 —— 指南里"同一件事两份实现"那个老形状。）
    function paintWoCount(total, open) {
      document.getElementById("woCount").textContent =
        total ? `共 ${total} 条，未结 ${open} 条` : "暂无";
      const num = document.getElementById("woNum");
      if (num) {
        num.textContent = open;                    // 只放数字，窄屏绝对定位在图标右上角
        num.classList.toggle("show", open > 0);    // 0 条时不挂红点，别天天报警
      }
    }

    // #39-C：驿站这块「待处理问题」标成已解决会被 #29 **自动收起**，而这里以前没有
    // 管理端那行「🗄 已归档 N 条」—— 办完一条就当场消失。用户那句
    // 「管理端能找到处理完的历史记录，驿站没有」正身是这一处。
    // 三条纪律：
    //   · 措辞里**不许出现"删除"**（那是软删，台账一条没少），沿用 #29 那句"从列表收起、可随时放回"；
    //   · 条数与明细都由后端给（`archived_count` / `/api/station/workorders/archived`），
    //     前端不自己猜"哪一条算办完"——判据只许有一处；
    //   · 放回**不开新接口**：走既有的状态口（反向 auto_unarchived 在服务端那一处）。
    //
    // 下面这三个小函数是**两块表共用**的（工单 + 登记条目）：一处写两遍就会有一天只改一遍，
    // 措辞、颜色、点开/收起的脾气都会分叉 —— 这个项目为"两份表"付过几次钱了。
    function archShell(box, n, fill) {
      if (!n) return null;                     // 一条都没收起就不挂这行（挂个「已处理 0 条」是噪音）
      const line = document.createElement("div");
      line.textContent = `🗄 已处理 ${n} 条（点开查看，台账里没动）`;
      line.style.cssText = "cursor:pointer;color:#8a93a6;font-size:12px;margin:8px 0;";
      const pane = document.createElement("div");
      pane.style.display = "none";
      line.addEventListener("click", () => {
        const opening = pane.style.display === "none";
        pane.style.display = opening ? "" : "none";
        if (opening && !pane.dataset.filled) fill(pane);
      });
      box.appendChild(line);
      box.appendChild(pane);
      return { line: line, pane: pane };
    }

    function archRow(pane, text, onBack) {
      const row = document.createElement("div");
      row.className = "woItem";
      row.textContent = text;                  // 一律 textContent：这些字段是学生写的或接口给的
      const back = document.createElement("button");
      back.textContent = "放回列表";
      back.addEventListener("click", async () => {
        back.disabled = true;
        try {
          await onBack();
        } catch (e) {
          addMsg("系统", "放回没成功：" + e.message, "sys");
        }
        back.disabled = false;
      });
      row.appendChild(back);
      pane.appendChild(row);
      return row;
    }

    function renderWoArch(box, n) {
      archShell(box, n, async (pane) => {
        pane.textContent = "读取中…";
        try {
          const resp = await fetch("/api/station/workorders/archived");
          if (!resp.ok) throw new Error(httpFailReason(resp, {}));
          const a = await resp.json();
          const rows = a.workorders || [];
          pane.innerHTML = "";
          rows.forEach(w => archRow(pane, (w.ts || "") + "｜" + (w.kind || "其他问题") + "｜"
            + (w.desc || "（学生没补充描述）") + "｜👤 " + (w.owner || "未登记"), async () => {
            // 放回走既有的状态口：这里**不复制**一份"什么算放回"的判断
            const r2 = await fetch("/api/station/workorders/"
              + encodeURIComponent(w.id || "") + "/status", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: "处理中" }),
            });
            const r = await r2.json().catch(() => ({}));
            if (!r2.ok) addMsg("系统", "放回没成功：" + httpFailReason(r2, r), "sys");
            else if (r.error) addMsg("系统", "放回没成功：" + r.error, "sys");
            else addMsg("系统", "已放回列表（台账里那条一直在）", "sys");
            // 整块重读，这一行连 pane 一起换新（局部删一行 = 第二份"什么算已处理"）
            pane.dataset.filled = "";
            woSig = null;
            loadWorkorders();
          }));
          if (!rows.length) pane.textContent = "这一会儿已经没有已处理的记录了（刚被放回去？）";
          else pane.dataset.filled = "1";
        } catch (e) {
          pane.textContent = "读不到已处理的历史（服务没起来？）";
          pane.dataset.filled = "";            // 这次没读到，下次点开再试 —— 别把"读失败"当"没历史"挂死
        }
      });
    }

    async function loadWorkorders() {
      const box = document.getElementById("woList");
      try {
        const d = await (await fetch("/api/station/workorders")).json();
        const list = d.workorders || [];
        const open = list.filter(w => w.status !== "已解决").length;
        // ⚠️ 画状态必须在下面那道"签名没变就返回"的闸**之前**：
        //    放到后面，清单不变时角标就永远不更新 —— 而"在别的视图也能看见未结几条"正是把这块挪进左栏后要补的账。
        paintWoCount(list.length, open);
        const sig = JSON.stringify(list);
        // 这块同样 5 秒重建一次。这里没有输入框，但按钮有：清单一变就把光标下那个节点 detach 掉，
        // 点下去就是"没反应"（真机复现过：报 Node is detached from document）。
        // 请求在飞的时候也不重建 —— 否则那张禁用中的按钮会凭空换一张，看着像没点上。
        if (sig === woSig || woBusy) return;
        woSig = sig;
        if (!list.length) {
          box.innerHTML = '<div class="woEmpty">还没有学生报障。学生确认上报后会落到这里。</div>';
          // ⚠️ 空表**更要**挂这一行：全部办完的那一刻，正是"东西不见了"的那一刻。
          //    （施工单把插入点写在 `box.innerHTML = ""` 之后，那样这条路永远走不到空表分支。）
          renderWoArch(box, d.archived_count || 0);
          return;
        }
        box.innerHTML = "";
        list.slice(0, 20).forEach(w => {
          const st = w.status || "待处理";
          const el = document.createElement("div");
          el.className = "woItem";
          // 一律走 esc()（全站唯一转义来源）：kind/desc 都是学生写的话，不转义就是 XSS 入口
          el.innerHTML = `<div class="body">
            <div><span class="kind">${esc(w.kind || "其他问题")}</span>
              <span class="${woCls(st)}">${esc(st)}</span></div>
            <div>${esc(w.desc || "（学生没补充描述）")}</div>
            <div class="meta"><span class="who">👤 ${esc(w.owner || "未登记")}</span>${esc(w.ts || "")} · 来源 ${esc(w.source || "")} · 编号 ${esc(w.id || "")}</div>
          </div>`;
          const b = document.createElement("button");
          b.textContent = "改成「" + (WO_NEXT[st] || "待处理") + "」";
          b.addEventListener("click", async () => {
            b.disabled = true;
            woBusy = true;
            const to = WO_NEXT[st] || "待处理";   // 这一次要点过去的那一档
            try {
              const resp = await fetch("/api/station/workorders/"
                + encodeURIComponent(w.id || "") + "/status", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: to }),
              });
              // 非 2xx 一律按失败办。守门看 HTTP 层而不是 body 的 r.ok：网关错误页不是 JSON，
              // 那种情况会先在 .json() 里抛，等不到读 body。
              const r = await resp.json().catch(() => ({}));
              if (!resp.ok) addMsg("系统", "改状态没成功：" + httpFailReason(resp, r), "sys");
              else if (r.error) addMsg("系统", "改状态没成功：" + r.error, "sys");
              // #29：标成「已解决」会**自动**从驿站这块列表里收起 —— 那一行就此不见。
              // 不写一句"去哪了、在哪儿能找回来"，驿站管理员看到的就等于"东西凭空消失"（措辞里不许有"删除"）。
              // #39-C 之后那句"去哪找"改了：驿站本页下面那行「🗄 已处理 N 条」就能看、能放回，
              // 不再只指向管理端 —— 旧话术留着就是指着远处让人绕路（过期注释/过期回执同一族）。
              else if (r.auto_archived) addMsg("系统", "已标为「" + to + "」，这条已从上面那张表收起"
                + "（下面那行「🗄 已处理 N 条」里看得见、可放回；台账里那条没动）", "sys");
              else if (r.auto_unarchived) addMsg("系统", "已改回「" + to
                + "」，并从归档里放回，列表里重新看得见", "sys");
            } catch (e) {
              addMsg("系统", "改状态没成功：" + e.message, "sys");
            }
            woBusy = false;
            loadWorkorders();
          });
          el.appendChild(b);
          box.appendChild(el);
        });
        // #39-C：未结那张表画完，再挂"已处理"那一行（两条分支都要挂，见上面空表那一支）
        renderWoArch(box, d.archived_count || 0);
      } catch (e) {
        document.getElementById("woCount").textContent = "读取失败";
        // 读不到的时候把角标也收掉：挂着一个上一分钟的红点，比没红点更容易让人以为"还有几条等着"
        const num = document.getElementById("woNum");
        if (num) num.classList.remove("show");
        woSig = null;   // 读失败后允许下次重建（同 svcSig 那条：不然这句报错会挂死）
        box.innerHTML = '<div class="woEmpty">读不到待处理问题（服务没起来？）</div>';
      }
    }
    document.getElementById("refreshWo").addEventListener("click", loadWorkorders);
    setInterval(loadWorkorders, 5000);
    loadWorkorders();

    // ---------- 低代码新增服务（#18 单子 3，创新点那块饼的落地处） ----------
    // 流程：管理员一句话 → POST /api/station/services → 模型**只产一份"服务定义"数据**
    // → 服务端过白名单校验（不合规直接 400，连库都不进）→ 立刻出现在下面这张表里、当场能登记。
    // ⚠️ 这里刻意没有"预览草稿再点保存"那一步：那要先存一份没收口的定义，
    //    等于给"半份服务"开门；现在能存在的定义都是过校验的，界面直接用它，演示也更直。
    let svcSig = null;   // 上一次真正渲染进 DOM 的清单（JSON 串）
    // #39：通用确认框。写法照管理端那一处（`onclick` 赋值而不是 addEventListener）：
    // 这框会被反复打开，监听器一层层攒着的话，第二次按【确定】会同时跑好几个回调
    // —— 而这一页正是 5 秒轮询在重画 DOM 的那一页，最容易撞上。
    const cfMask = document.getElementById("confirmMask");
    function stConfirm(opts) {
      return new Promise(resolve => {
        document.getElementById("cfHead").textContent = opts.title || "确定吗？";
        document.getElementById("cfBody").textContent = opts.body || "";
        const warn = document.getElementById("cfWarn");
        warn.textContent = opts.warn || "";
        warn.style.display = opts.warn ? "" : "none";
        document.getElementById("cfOk").textContent = opts.okText || "确定";
        cfMask.classList.add("show");
        document.getElementById("cfCancel").focus();
        const okBtn = document.getElementById("cfOk");
        const cancelBtn = document.getElementById("cfCancel");
        const done = (v) => {
          cfMask.classList.remove("show");
          okBtn.onclick = null; cancelBtn.onclick = null; cfMask.onclick = null;
          resolve(v);
        };
        okBtn.onclick = () => done(true);
        cancelBtn.onclick = () => done(false);
        cfMask.onclick = (e) => { if (e.target === cfMask) done(false); };
      });
    }

    async function loadServices(force) {
      const box = document.getElementById("svcList");
      const cnt = document.getElementById("svcCount");
      try {
        const d = await (await fetch("/api/station/services")).json();
        // #54：只画归驿站的那一档。真正的闸在**后端**（`_station_only` / `_dept_guard`），
        // 这里这一道只是"不必让店员看见不归他的服务"，不是权限判据 ——
        // 拿 sid 直接打接口才是这条路的正门，那道 403 才是真的。
        // 兜底写法和 `store.dept_of` 一致：没有 dept 键的老定义归驿站。
        const list = (d.services || []).filter(s => String(s.dept || "驿站") === "驿站");
        const sig = JSON.stringify(list);
        // 5 秒一次的轮询不许把管理员刚敲进登记表单的字抹掉：清单没变就不重建 DOM；
        // 变了但有人在填（有焦点或有内容）也先跳过，svcSig 不更新 → 填完下一轮自动补渲染。
        // 真机踩出来的：不挡就会在点【登记一条】那一瞬把按钮 detach 掉，提交直接失败。
        // force（#39-A 删除那一路）：删完必须让屏幕跟上，不然就是"删掉了但还挂着"——
        //   那道表单保护恰恰会造成这个假象，所以由调用方明确说"这次必须重建"。
        if (!force && (sig === svcSig || box.querySelector("input:focus, input:not(:placeholder-shown)"))) return;
        svcSig = sig;
        cnt.textContent = `共 ${list.length} 项`;
        if (!list.length) { box.innerHTML = '<div class="woEmpty">还没有服务。</div>'; return; }
        box.innerHTML = "";
        list.forEach(s => {
          const el = document.createElement("div");
          el.className = "svc";
          const trig = (s.triggers || []).map(t => `<span class="pill">${esc(t)}</span>`).join("");
          const fields = (s.collect_fields || []).map(f => String(f));
          el.innerHTML = `<div><span class="nm">${esc(s.name || "未命名")}</span>
              <span class="tb">台账 ${esc(s.table || "-")} · id ${esc(String(s.id || ""))} · 归${esc(String(s.dept || "驿站"))}</span></div>
            <div>${trig}</div>`;
          const form = document.createElement("form");
          const inputs = fields.map(f => {
            const i = document.createElement("input");
            i.placeholder = f;
            i.name = "f_" + f;
            i.required = true;
            form.appendChild(i);
            return { f: f, el: i };
          });
          const b = document.createElement("button");
          b.type = "submit";
          b.textContent = "登记一条";
          form.appendChild(b);
          const last = document.createElement("div");
          last.className = "last";
          form.addEventListener("submit", async ev => {
            ev.preventDefault();
            b.disabled = true;
            const payload = {};
            inputs.forEach(x => { payload[x.f] = x.el.value.trim(); });
            try {
              const resp = await fetch("/api/station/services/"
                + encodeURIComponent(String(s.id || "")) + "/records", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fields: payload }),
              });
              const r = await resp.json().catch(() => ({}));
              if (!resp.ok) { last.style.color = "#cf1322"; last.textContent = "没登记成：" + httpFailReason(resp, r); }
              else if (r.error) { last.style.color = "#cf1322"; last.textContent = "没登记成：" + r.error; }
              else {
                last.style.color = "#389e0d";
                last.textContent = (r.reply || "已登记。") + "（记录号 " + (r.record && r.record.id) + "）";
                inputs.forEach(x => { x.el.value = ""; });
              }
            } catch (e) {
              last.style.color = "#cf1322";
              last.textContent = "没登记成：" + e.message;
            }
            b.disabled = false;
          });
          // #39-A：低代码只能一句句长，建错了没法收（用户点名那一件）。
          // ⚠️ 内置那项（`table=workorders`）**不给按钮** —— 判据与后端 `store.delete_service`
          //    是同一条（看 table，不是看 id `pkgloss`）：两道都要，但后端那道才是真的，
          //    前端这一道只是让人不必去点一个注定失败的按钮。
          //    删的只是**服务定义**：`custom/<id>.json` 里已登记的记录一条不动，确认框里就这么说。
          if (String(s.table || "") !== "workorders") {
            const del = document.createElement("button");
            del.textContent = "删除服务";
            del.style.cssText = "margin:0 0 6px 6px;";
            del.addEventListener("click", async () => {
              if (!await stConfirm({
                title: "删除服务「" + (s.name || "") + "」？",
                body: "只删服务定义。它名下已登记的记录留在各自的台账里，不受影响。",
                warn: "定义删了可以用那句话再生成一份；已登记的记录不会跟着走。",
                okText: "删除服务",
              })) return;
              del.disabled = true;
              try {
                const resp = await fetch("/api/station/services/"
                  + encodeURIComponent(String(s.id || "")), { method: "DELETE" });
                const r = await resp.json().catch(() => ({}));
                if (!resp.ok) { last.style.color = "#cf1322"; last.textContent = "没删成：" + httpFailReason(resp, r); del.disabled = false; return; }
                if (r.error) { last.style.color = "#cf1322"; last.textContent = "没删成：" + r.error; del.disabled = false; return; }
                // 成功那句只能进聊天流：下面这两句会把整个服务块（连同 `last` 那一行）重建掉，
                // 把回执写在正在被替换的节点上 = 又变成"点了没反应"。
                addMsg("系统", "已删除服务「" + (s.name || "") + "」：定义没了，它的历史台账没动", "sys");
                await loadServices(true);   // force：见上面那道 sig 闸的注释
                await loadRecords();
              } catch (e) {
                last.style.color = "#cf1322";
                last.textContent = "没删成：" + e.message;
                del.disabled = false;
              }
            });
            el.appendChild(del);
          }
          // ★ #54（原 52-C，必须与本单的部门过滤**同一批**做）：内置那项**不给登记表单**。
          //   它名下那个表单通向 `add_custom_record("pkgloss")` ⇒ 写的是 `custom/pkgloss.json`：
          //   工单里没有、学生看不到、也不按服务分组展示 —— 那是第三本账，谁都无法解释。
          //   只加部门过滤而留着这张表单，驿站台账里就永远挂着这么一块。
          //   ⚠️ `form` 照旧**构造**（只是不挂进 DOM）：这段里的文案有多条护栏是按位置取的
          //      （test_53/test_58），把整段挪进 if 里会让那些钉子指向别处 —— 挪不动的不是代码，是账。
          if (String(s.table || "") !== "workorders") {
            el.appendChild(form);
          } else {
            last.textContent = "这一项是内置的那条链路：学生在对话里说一句就出确认卡，"
              + "单子进上面的「待处理问题」，这里不登记。";
          }
          el.appendChild(last);
          // 「📋 登记条目」（#24 决策①）：驿站是运营台，学生递进来的东西看不见就没法处理。
          // 先占个位，内容由 loadRecords() 单独填（台账会变，服务定义却不一定变）。
          // ⚠️ 内置那项（table=workorders）**不摆这个块**：它的台账就是上面那块「🛠️ 待处理问题」，
          // 在这儿显示一句"还没有一条"会让人以为 `custom/pkgloss.json` 才是它的账（其实空是必然）。
          if (String(s.table || "") !== "workorders") {
            const recs = document.createElement("div");
            recs.className = "recs";
            recs.dataset.sid = String(s.id || "");
            recs.textContent = "📋 登记条目：读取中…";
            el.appendChild(recs);
          }
          box.appendChild(el);
        });
      } catch (e) {
        cnt.textContent = "读取失败";
        svcSig = null;   // 读失败后必须允许下次重建，否则这句报错会一直挂着
        box.innerHTML = '<div class="woEmpty">读不到服务清单（服务没起来？）</div>';
      }
    }

    // 登记条目（#24 决策①）：读接口早就有（GET /api/station/services/<id>/records），
    // 之前页面只摆了登记表单，没摆台账 —— 驿站就成了"往里扔但看不见"的黑洞。
    // 标签写中性话：这张表**两个写入方**（学生点确认、驿站管理员现场登记）都落在这里，
    // 叫"学生登记"会把管理员自己登记的那几条说成不是他们登的。
    // 只读展示 → 现在带**处理状态**（#27）：状态是**流程**不是内容，所以它不进 `collect_fields`，
    // 由系统在登记时给「待处理」，词表与上面「待处理问题」共用同一份（后端 _WO_STATUSES）。
    // ⚠️ 已知边界：下面只列**最新 5 条**（rows.slice(0, 5)），第 6 条往外的记录点不到改状态按钮 ——
    //    翻页是另一件事，本单不动这个上限，先写在这儿免得下一位以为"全部都能改"。
    // ⚠️ 渲染一律用 textContent / createElement，学生填的内容一个字都不进 innerHTML。
    async function loadRecords() {
      for (const rec of document.querySelectorAll("#svcList .recs")) {
        const sid = rec.dataset.sid || "";
        let rows = null;
        try {
          const r = await (await fetch("/api/station/services/"
            + encodeURIComponent(sid) + "/records")).json();
          rows = r.records || [];
        } catch (e) {
          rows = null;
        }
        if (rows === null) {
          rec.textContent = "📋 登记条目：读不到（服务没起来？）";
          rec.dataset.sig = "";   // 读失败要把签名清掉：下一次读到了才允许重建（同 svcSig 那条规矩）
          continue;
        }
        // ⚠️ 内容没变就不重建（真机撞出来的）：这块原本每 5 秒无条件 `rec.innerHTML = ""`，
        //    于是管理员刚点开「🗄 已处理 N 条」那一行，下一轮轮询就把它自己合上了 ——
        //    本单要解决的正是"处理完的历史看不见"，面板自己关掉等于没做。
        //    状态一改、记录一删，JSON 就变了，照样立刻重画（不影响 #27/#39-B 那两颗按钮的节奏）。
        const sig = JSON.stringify(rows);
        if (rec.dataset.sig === sig) continue;
        rec.dataset.sig = sig;
        rec.innerHTML = "";     // 只装下面我们自己建的节点
        // #39-C：登记这块也分"未结 / 已处理"两层，与上面那张工单表同一个长相。
        // ⚠️ 词表用 `已解决` —— 登记记录与工单**共用那一份 `_WO_STATUSES`**（待处理/处理中/已解决），
        //    没有"已处理"这一档（施工单 §39-C③ 写的是"已处理"，照抄会一行都挑不出来，
        //    功能静默不生效）。"已处理"只是这行**标题**的人话说法，判据仍是状态。
        const liveRows = rows.filter(x => (x.status || "待处理") !== "已解决");
        const doneRows = rows.filter(x => (x.status || "待处理") === "已解决");
        const head = document.createElement("div");
        head.className = "recHead";
        head.textContent = rows.length
          ? `📋 已登记 ${rows.length} 条（未结 ${liveRows.length}，列最新 ${Math.min(5, liveRows.length)} 条）`
          : "📋 已登记：还没有一条";
        rec.appendChild(head);
        liveRows.slice(0, 5).forEach(item => {
          const f = item.fields || {};
          const bits = Object.keys(f).filter(k => String(f[k] || "").trim())
            .map(k => k + "：" + f[k]);
          const line = document.createElement("div");
          line.className = "recRow";
          // ⚠️ 先把正文写进 textContent，**再** append 子节点：
          //    反过来（先 append 再赋 textContent）会把刚加进去的按钮整块擦掉。
          line.textContent = (item.ts || "") + "｜" + (bits.join("；") || "（没填内容）");
          // 状态芯片 + 改状态按钮：与上面「待处理问题」那块共用 WO_NEXT / woCls，
          // 两块表的词与长相都一致（不会出现"工单叫已解决、登记叫已处理"这种自己都对不上）。
          const st = item.status || "待处理";   // 老记录没有 status 键 → 显示"待处理"，不迁移文件
          const tail = document.createElement("div");
          tail.style.cssText = "margin-top:3px;display:flex;gap:6px;align-items:center;";
          const chip = document.createElement("span");
          chip.className = woCls(st);
          chip.textContent = st;
          const sbtn = document.createElement("button");
          sbtn.textContent = "改成「" + (WO_NEXT[st] || "待处理") + "」";
          sbtn.addEventListener("click", async () => {
            sbtn.disabled = true;
            try {
              const resp = await fetch("/api/station/services/" + encodeURIComponent(sid)
                + "/records/" + encodeURIComponent(String(item.id || "")) + "/status", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: WO_NEXT[st] || "待处理" }),
              });
              const r = await resp.json().catch(() => ({}));
              if (!resp.ok) addMsg("系统", "改状态没成功：" + httpFailReason(resp, r), "sys");
              else if (r.error) addMsg("系统", "改状态没成功：" + r.error, "sys");
            } catch (e) {
              addMsg("系统", "改状态没成功：" + e.message, "sys");
            }
            svcTick();    // 改完立刻重读，节奏与工单那块（loadWorkorders）一致
          });
          tail.appendChild(chip);
          tail.appendChild(sbtn);
          // #39-B：每行补一颗「删除」。这条是**真删**（登记记录没有归档那一档，
          // 状态词表与工单共用 `_WO_STATUSES`，多不出"已收起"这种状态），
          // 所以确认框与回执都不许含糊：说清楚"删了台账里就没了、找不回来"。
          // ⚠️ 已知边界与上面「改成」那颗一样：这块只列**最新 5 条**，
          //    第 6 条往外的记录点不到删除 —— 翻页是另一件事，不在本单，别以为删不了就是坏了。
          const del = document.createElement("button");
          del.textContent = "删除";
          del.addEventListener("click", async () => {
            if (!await stConfirm({
              title: "删除这条登记记录？",
              body: "登记记录没有「归档」这一档 —— 这是真删，台账里那条就没了。",
              warn: "想留着记录只是先放一放的话，别删：用旁边那颗【改成】标成「处理中」，它会留在未结那张表里。",
              okText: "删除记录",
            })) return;
            del.disabled = true;
            let done = false;
            try {
              const resp = await fetch("/api/station/services/" + encodeURIComponent(sid)
                + "/records/" + encodeURIComponent(String(item.id || "")), { method: "DELETE" });
              const r = await resp.json().catch(() => ({}));
              if (!resp.ok) addMsg("系统", "没删成：" + httpFailReason(resp, r), "sys");
              else if (r.error) addMsg("系统", "没删成：" + r.error, "sys");
              else { addMsg("系统", "已删除这条登记记录（台账里少一条，找不回来）", "sys"); done = true; }
            } catch (e) {
              addMsg("系统", "没删成：" + e.message, "sys");
            }
            if (done) svcTick();   // 只有真删成才重读；没成时把那颗按钮留着，让人看得见那一行还在
            else del.disabled = false;
          });
          tail.appendChild(del);
          line.appendChild(tail);
          rec.appendChild(line);
        });
        // #39-C：登记这块也要有"已处理"那一层（用户那句"已处理遮不住"是同一件事的两半）。
        // 标题说人话"已处理"，**判据是状态里那一档「已解决」**（词表与工单共用一份，没有"已处理"这一档）。
        // 明细就在手里（GET …/records 本来就全量返回），所以这里不另开接口，只补一层视图。
        archShell(rec, doneRows.length, (pane) => {
          pane.innerHTML = "";
          doneRows.forEach(item => {
            const f = item.fields || {};
            const bits = Object.keys(f).filter(k => String(f[k] || "").trim())
              .map(k => k + "：" + f[k]);
            archRow(pane, (item.ts || "") + "｜" + (bits.join("；") || "（没填内容）"), async () => {
              const resp = await fetch("/api/station/services/" + encodeURIComponent(sid)
                + "/records/" + encodeURIComponent(String(item.id || "")) + "/status", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "待处理" }),
              });
              const r = await resp.json().catch(() => ({}));
              if (!resp.ok) addMsg("系统", "放回没成功：" + httpFailReason(resp, r), "sys");
              else if (r.error) addMsg("系统", "放回没成功：" + r.error, "sys");
              else addMsg("系统", "已放回列表（这条的状态改回「待处理」）", "sys");
              pane.dataset.filled = "";
              svcTick();
            });
          });
          pane.dataset.filled = "1";
        });
      }
    }

    document.getElementById("refreshSvc").addEventListener("click", () => {
      loadServices().then(loadRecords);
    });
    document.getElementById("svcGo").addEventListener("click", async () => {
      const idea = document.getElementById("svcIdea");
      const btn = document.getElementById("svcGo");
      const txt = (idea.value || "").trim();
      if (!txt) { return; }
      btn.disabled = true;
      btn.textContent = "生成中…";
      try {
        const resp = await fetch("/api/station/services", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ description: txt }),
        });
        const r = await resp.json().catch(() => ({}));
        if (!resp.ok) { addMsg("系统", "没能生成服务：" + httpFailReason(resp, r), "sys"); }
        else if (r.error) { addMsg("系统", "没能生成服务：" + r.error, "sys"); }
        else {
          addMsg("系统", `已新增服务「${r.service.name}」（id ${r.service.id}），`
            + `要收的字段：${(r.service.collect_fields || []).join("、")}。在上方那张表里就能直接登记。`,
            "sys");
          idea.value = "";
          svcTick();   // 建完立刻重画清单，并给新服务把"学生登记条目"那块填上
        }
      } catch (e) {
        addMsg("系统", "没能生成服务：" + e.message, "sys");
      }
      btn.disabled = false;
      btn.textContent = "生成服务";
    });
    // 一轮 tick：先看服务定义有没有变（变了才重建 DOM），再把每项服务的登记台账刷一遍
    async function svcTick() {
      await loadServices();
      await loadRecords();
    }
    setInterval(svcTick, 5000);
    svcTick();

    // ---------- 对话 ----------
    function addMsg(who, content, kind, trace, module) {
      const el = document.createElement("div");
      el.className = "msg " + (kind === "sys" ? "sys" : (who === "我" ? "user" : "bot"));
      let html = `<div class="who">${esc(who)}${module ? `<span class="tag">${esc(module)}</span>` : ""}</div>`;
      html += `<div class="bubble">${esc(content)}</div>`;
      if (trace && trace.length) {
        // 把 Agent 的思考轨迹铺开：能看到它调用了什么工具、拿到什么结果
        const lines = trace.map(t => {
          if (t.action) return `${t.phase || ""} ${t.action}(${JSON.stringify(t.args || {})})`;
          if (t.answer) return `${t.phase || ""} ${t.answer}`;
          return t.phase || "";
        }).join("\n");
        html += `<div class="trace">🧠 Agent 思考轨迹：\n${esc(lines)}</div>`;
      }
      el.innerHTML = html;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMsg(msg) {
      if (!msg.trim()) return;
      addMsg("我", msg);
      text.value = "";
      send.disabled = true;
      try {
        // 关键：显式带 module:"station"，后端就会用"客服人格 + 快递台账"这套配置来回答
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, module: "station", session_id: stationSid() }),
        });
        const data = await resp.json().catch(() => ({}));
        // 第 5 处同形状（#28 施工单只点了 4 处，整族扫在这儿多找到一处）：
        // /api/chat 回 500/429 时正文里只有 detail，`if (data.error)` 判不到，
        // 就会走下面那句 addMsg(data.answer=undefined) —— 客服"回"了一句空话，跟谎报成功一个形状。
        if (!resp.ok) addMsg("客服", "没能问到话：" + httpFailReason(resp, data), "sys");
        else if (data.error) addMsg("客服", "出错了：" + data.error);
        else addMsg("客服", data.answer, "bot", data.trace, data.module);
      } catch (e) {
        addMsg("客服", "网络或接口异常：" + e.message);
      } finally {
        send.disabled = false;
      }
    }

    // ---------- 上传资料给客服读（比如一批待取清单） ----------
    const fileInput = document.getElementById("file");
    document.getElementById("attach").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", handleFile);

    async function handleFile() {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      addMsg("我", `📎 上传了资料：${f.name}`, "user");
      const form = new FormData();
      form.append("file", f);
      try {
        const r = await fetch("/api/upload", { method: "POST", body: form });
        const d = await r.json();
        if (d.ok) {
          addMsg("系统", `《${f.name}》已就位（${d.file.chars} 字）。可以让客服照着它干活了 —— 会以当前人格语气作答。`, "sys");
          // 换成"照着这份资料干活"的三条建议（同一份 renderChips，不再手写第二遍）
          renderChips(["照这份清单写一版取件提醒", "这里面有几件已经滞留了？", "帮我总结这份资料"]
            .map(q => ({ t: q, q: q, cls: "" })));
        } else {
          addMsg("系统", "上传失败：" + (d.error || "未知原因"), "sys");
        }
      } catch (e) {
        addMsg("系统", "上传异常：" + e.message, "sys");
      }
      fileInput.value = "";
    }

    // ---------- 清空对话记录 ----------
    // ⚠️ 这里清的是**聊天流**，不是台账：
    //    · 会话从 #30 起是**固定**的（sessionStorage 里那个 id），服务端真的存着这一段，
    //      所以清空是两件事、顺序不能反：**先清服务端 → 成功才动屏幕 → 最后换一个新 id**。
    //      只擦屏幕的话，按 F5 会把整段历史原样捞回来，"清空"就演成了"已经清干净了"。
    //    · 待处理问题、服务与登记、学生登记条目**一条都不动**，界面上必须把这句说出来，
    //      否则管理员会以为【清空】把学生上报的问题也删了，那就没人敢点。
    const greetEl = log.querySelector(".msg.bot");
    const clearMask = document.getElementById("clearMask");

    function clearMsgCount() {
      const n = log.querySelectorAll(".msg").length;
      return greetEl ? Math.max(0, n - 1) : n;   // 开场白不算"聊出来的内容"
    }

    function openClearDialog() {
      const n = clearMsgCount();
      // 计数用 textContent，不为了一个加粗去走 innerHTML（全站转义只有一份来源，能少一个入口就少一个）
      document.getElementById("clearSummary").textContent =
        `当前这段对话里有 ${n} 条消息。`
        + (n <= 0 ? "现在还只有开场白，暂时没什么可清的。" : "清空之后它们就都消失了，找不回来。");
      clearMask.classList.add("show");
      document.getElementById("clearCancel").focus();
    }
    function closeClearDialog() { clearMask.classList.remove("show"); }

    async function doClearChat() {
      // #30 之后服务端**真的**存着这段对话（会话固定了），所以"清空"必须是两件事，且顺序不能反：
      //   ① 先清服务端 → ② 清成功才动屏幕 → ③ 换一个新的 session id。
      // 先擦屏幕的话，"清失败"会被演成"已经清干净了"，而按 F5 会把整段历史原样捞回来。
      // reset 顺手还会 clear_pending（那张没人认领的卡一起作废）—— 页面上**不许**再清一次，那是第二份判据。
      const sid = stationSid();
      let ok = false, removed = 0;
      try {
        const resp = await fetch("/api/chat/reset", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sid }),
        });
        const d = await resp.json().catch(() => ({}));
        ok = resp.ok && d.ok !== false;
        removed = Number(d.removed || 0);
      } catch (e) { ok = false; }
      if (!ok) {
        // 一个字都不擦：宁可让店员再点一次，也别演一出"清了"
        addMsg("系统", "清空没成功，聊天记录原样保留，请再试一次。", "sys");
        closeClearDialog();
        return;
      }
      // ③ 最关键的一步：**换一个新的 id**。不换 = 按 F5 历史又回来，清了跟没清一个样
      //     （学生端那一轮踩过同一条，别在这儿重犯）。
      sessionStorage.setItem(STATION_SID_KEY, newStationSid());
      // 整块清干净再把开场白放回去：原来那种"留着第一条、删掉其余"会越清越攒 ——
      // 每次清空都留下一条系统回执，第二次点【清空】时计数就把这些回执也算成"对话内容"。
      while (log.firstChild) log.removeChild(log.firstChild);
      if (greetEl) log.appendChild(greetEl);
      renderChips(CHIPS);      // 快捷操作恢复成默认 5 条（上传资料后会被换成 3 条建议问题）
      addMsg("系统", "对话已清空，并已开一段新的" + (removed ? "（服务端清了 " + removed + " 条）" : "")
        + "。左边「待处理问题」「服务与登记」里的台账一条没动。", "sys");
      closeClearDialog();
    }

    document.getElementById("clearChat").addEventListener("click", openClearDialog);
    document.getElementById("clearCancel").addEventListener("click", closeClearDialog);
    document.getElementById("clearOk").addEventListener("click", doClearChat);
    clearMask.addEventListener("click", e => { if (e.target === clearMask) closeClearDialog(); });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && clearMask.classList.contains("show")) closeClearDialog();
    });

    send.addEventListener("click", () => sendMsg(text.value));
    text.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(text.value); });

    // 进页面先读一次人格
    loadPersona();
  </script>
</body>
</html>
