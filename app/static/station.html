<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园时间管家 · 驿站/商户端</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fb; color: #1f2733;
    }
    header {
      background: linear-gradient(135deg, #17b8a6, #2f9e6f);
      color: #fff; padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .9; font-size: 13px; }
    .wrap { max-width: 900px; margin: 18px auto; padding: 0 16px; }

    /* 客服人格卡片：显示管理后台配的人设，让人一眼看到"人格是活的" */
    .persona {
      background: #fff; border-radius: 12px; padding: 14px 16px;
      border-left: 5px solid #17b8a6; box-shadow: 0 4px 16px rgba(40,60,120,.08);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .persona .left { flex: 1; }
    .persona .nm { font-size: 15px; font-weight: 600; }
    .persona .rl { font-size: 13px; color: #6a7388; margin: 2px 0 6px; }
    .persona .tm { font-size: 12px; color: #4a5366; }
    .persona .tm div { margin: 3px 0; }
    .persona .tm b { color: #17b8a6; }
    .refresh {
      border: 1px solid #17b8a6; background: #fff; color: #17b8a6;
      border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .refresh:hover { background: #e8f8f6; }
    .persona a { font-size: 12px; color: #6a7388; display: inline-block; margin-top: 6px; }

    .hint { font-size: 13px; color: #6a7388; margin: 14px 2px 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip {
      background: #fff; border: 1px solid #d8def0; border-radius: 16px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: #17b8a6;
    }
    .chip:hover { background: #e8f8f6; }
    .chip.warn { color: #e08c2a; border-color: #f3d9b0; }
    .chip.warn:hover { background: #fff7ec; }

    #log {
      background: #fff; border-radius: 12px; padding: 16px;
      min-height: 300px; max-height: 440px; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(40,60,120,.08);
    }
    .msg { margin: 10px 0; }
    .msg .who { font-size: 12px; color: #8a93a6; margin-bottom: 3px; }
    .msg .bubble {
      display: inline-block; padding: 10px 14px; border-radius: 12px;
      line-height: 1.55; white-space: pre-wrap; max-width: 92%;
    }
    .user .bubble { background: #17b8a6; color: #fff; border-bottom-right-radius: 2px; }
    .bot .bubble { background: #f0f3fa; color: #1f2733; border-bottom-left-radius: 2px; }
    .sys .bubble { background: #fff7e6; color: #8a6d3b; border: 1px dashed #ffd591; font-size: 13px; }
    .trace {
      margin-top: 6px; font-size: 12px; color: #6a7388;
      background: #fafbff; border: 1px dashed #d8def0; border-radius: 8px;
      padding: 8px 10px; white-space: pre-wrap;
    }
    .tag { display:inline-block; font-size:11px; background:#e8f8f6; color:#17b8a6; border-radius:6px; padding:1px 6px; margin-left:6px;}
    .inputbar { display: flex; gap: 10px; margin-top: 14px; }
    .inputbar input {
      flex: 1; padding: 12px 14px; border: 1px solid #d8def0; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    .inputbar button {
      padding: 0 22px; border: none; border-radius: 10px; cursor: pointer;
      background: #17b8a6; color: #fff; font-size: 14px;
    }
    .inputbar button:disabled { opacity: .6; cursor: not-allowed; }
    /* 回形针：上传资料（比如一批待取清单）给客服读 */
    .attach {
      padding: 0 14px; border: 1px solid #d8def0; background: #fff; color: #17b8a6;
      border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .attach:hover { background: #e8f8f6; }
    /* 待处理问题（学生报的快递/外卖问题流到驿站，#18 单子 2） */
    .wo { background: #fff; border: 1px solid #e6ebf5; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .woHead { font-size: 14px; font-weight: 600; color: #1f2733; }
    .woHead .cnt { font-weight: 400; color: #6a7388; font-size: 12px; margin-left: 6px; }
    .woItem { display: flex; gap: 10px; align-items: flex-start; border-top: 1px dashed #e6ebf5; padding: 9px 0; font-size: 13px; }
    .woItem .body { flex: 1; }
    .woItem .kind { font-weight: 600; }
    .woItem .meta { color: #8a93a5; font-size: 11px; margin-top: 2px; }
    .woItem .st { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: #fff1f0; color: #cf1322; }
    .woItem .st.doing { background: #fff7e6; color: #d46b08; }
    .woItem .st.done { background: #f6ffed; color: #389e0d; }
    .woItem button { border: 1px solid #d8def0; background: #fff; color: #17b8a6; border-radius: 7px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
    .woItem button:hover { background: #e8f8f6; }
    .woEmpty { color: #8a93a5; font-size: 12px; padding-top: 8px; }
    /* 低代码新增服务（#18 单子 3） */
    .svcAdd { display: flex; gap: 8px; margin-top: 10px; }
    .svcAdd input { flex: 1; padding: 9px 11px; border: 1px solid #d8def0; border-radius: 9px; font-size: 13px; }
    .svcAdd button { padding: 0 16px; border: none; border-radius: 9px; background: #17b8a6; color: #fff; cursor: pointer; font-size: 13px; }
    .svcAdd button:disabled { opacity: .6; cursor: progress; }
    .svc { border-top: 1px dashed #e6ebf5; padding: 9px 0; font-size: 13px; }
    .svc .nm { font-weight: 600; }
    .svc .pill { display: inline-block; font-size: 11px; background: #e8f8f6; color: #17b8a6; border-radius: 6px; padding: 1px 6px; margin: 0 4px 3px 0; }
    .svc .tb { font-size: 11px; color: #8a93a5; }
    .svc form { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .svc form input { padding: 6px 8px; border: 1px solid #d8def0; border-radius: 7px; font-size: 12px; width: 150px; }
    .svc form button { padding: 6px 12px; border: none; border-radius: 7px; background: #17b8a6; color: #fff; font-size: 12px; cursor: pointer; }
    .svc .last { font-size: 12px; color: #389e0d; margin-top: 5px; }
  </style>
</head>
<body>
  <header>
    <h1>校园时间管家 · 驿站/商户端 <a href="/" style="font-size:13px;color:#fff;float:right;opacity:.9;text-decoration:none;">← 返回登录</a></h1>
    <p>用自定义人格回复咨询 · 主动推送取件提醒与滞留预警</p>
  </header>

  <div class="wrap">
    <!-- 人格展示区：数据来自管理后台的客服人格配置，改完点刷新立即生效 -->
    <div class="persona">
      <div class="left" id="personaBox">
        <div class="nm">加载中…</div>
      </div>
      <div>
        <button class="refresh" id="refreshPersona">刷新人格</button>
      </div>
    </div>

    <!-- 学生报的快递/外卖问题流到驿站（#18 单子 2）：能看、能改处理状态 -->
    <div class="wo">
      <div class="woHead">🛠️ 待处理问题
        <span class="cnt" id="woCount">加载中…</span>
        <button class="refresh" id="refreshWo" style="float:right;font-size:12px;">刷新</button>
      </div>
      <div id="woList"><div class="woEmpty">正在读台账…</div></div>
    </div>

    <!-- 低代码新增服务：管理员一句话 → 模型只产"服务定义"这份数据 → 过白名单才落库（#18 单子 3） -->
    <div class="wo">
      <div class="woHead">🧩 服务（可低代码新增）
        <span class="cnt" id="svcCount">加载中…</span>
        <button class="refresh" id="refreshSvc" style="float:right;font-size:12px;">刷新</button>
      </div>
      <div class="svcAdd">
        <input id="svcIdea" placeholder="说一句话就行，例如：加一个失物招领，学生丢了饭卡可以登记" />
        <button id="svcGo">生成服务</button>
      </div>
      <div id="svcList"><div class="woEmpty">正在读服务清单…</div></div>
    </div>

    <div class="hint">点下面的快捷操作让客服干活，或直接提问（回复都用上面这个人格的语气）。</div>
    <div class="chips" id="chips"></div>

    <div id="log">
      <div class="msg bot">
        <div class="who">客服</div>
        <div class="bubble">你好，我是这里的 AI 客服 👋 我可以查台账帮你答复同学，也能主动给还没取件的同学发提醒。</div>
      </div>
    </div>

    <div class="inputbar">
      <input type="file" id="file" style="display:none;" />
      <button class="attach" id="attach" title="上传资料给客服读">📎</button>
      <input id="text" placeholder="问点什么，或让我写提醒文案…" />
      <button id="send">发送</button>
    </div>
  </div>

  <script src="/static/esc.js"></script>
  <script>
    // 快捷操作：前两个是"主动推送"，后面是常见咨询
    // 提示词都故意写成让 Agent 去调工具，这样页面上能看到它真的读了台账
    const CHIPS = [
      { t: "📦 列出还没取走的快递", q: "现在有哪些快递还没取走？按待取和滞留分开说明", cls: "" },
      { t: "🔔 写一条取件提醒", q: "用你的人设语气，给还没取件的同学写一条取件提醒，附上每个人的取件码", cls: "" },
      { t: "⚠️ 滞留件预警", q: "有哪些快递滞留超过 3 天了？用你的人设语气写一条滞留预警提醒", cls: "warn" },
      { t: "🔍 查取件码 B-5678", q: "帮我查一下取件码 B-5678 是什么东西", cls: "" },
      { t: "🎭 自我介绍一下", q: "用你自己的人设语气自我介绍一下，说说你是谁、说话什么风格", cls: "" },
    ];

    const log = document.getElementById("log");
    const text = document.getElementById("text");
    const send = document.getElementById("send");

    // ---------- 渲染快捷操作按钮 ----------
    const chipsBox = document.getElementById("chips");
    CHIPS.forEach(c => {
      const el = document.createElement("div");
      el.className = "chip " + c.cls;
      el.textContent = c.t;
      el.addEventListener("click", () => sendMsg(c.q));
      chipsBox.appendChild(el);
    });

    // ---------- 加载并展示当前客服人格 ----------
    // 数据来源：管理后台「客服人格配置」，存 persona.json
    // 每次对话后端都会重新读一次人格，所以管理员改完不用重启服务
    async function loadPersona() {
      try {
        const data = await (await fetch("/api/persona")).json();
        const p = data.persona;
        document.getElementById("personaBox").innerHTML = `
          <div class="nm">🎭 当前客服人格：${esc(p.name || "未命名")}<span class="tag">驿站/商户端</span></div>
          <div class="rl">${esc(p.role || "（未设置角色定位）")}</div>
          <div class="tm">
            <div><b>语气：</b>${esc(p.tone || "（未设置）")}</div>
            <div><b>准则：</b>${esc(p.rules || "（未设置）")}</div>
            <a href="/admin">← 去管理控制台改人设</a>
          </div>`;
      } catch (e) {
        document.getElementById("personaBox").innerHTML = '<div class="nm">人格加载失败</div>';
      }
    }
    document.getElementById("refreshPersona").addEventListener("click", () => {
      loadPersona();
      // 在系统消息里留一条痕迹，演示时能看出"刚刷新过"
      addMsg("系统", "已重新读取客服人格配置（管理员刚改的人设立即生效，无需重启）", "sys");
    });

    // ---------- 待处理问题（学生确认上报的快递/外卖问题，#18 单子 2） ----------
    // 数据来自 /api/station/workorders（演示级不挂口令，理由与限制写在 main.py 那一段注释里）。
    // 轮询 5000ms —— 跟管理台 loadMessages / loadWorkOrders 那两条同一个节奏（admin.html:588-590 实测就是 5000），
    // 不是拍的：两端节奏不一致会出现"管理端已看到、驿站还空着"那种演示事故。
    const WO_NEXT = { "待处理": "处理中", "处理中": "已解决", "已解决": "待处理" };

    function woCls(s) {
      return s === "已解决" ? "st done" : (s === "处理中" ? "st doing" : "st");
    }

    let woSig = null;    // 上一次真正渲染进 DOM 的清单（同 svcSig，见 #18 单子 3 那条坑）
    let woBusy = false;  // 有一条改状态的请求在飞
    async function loadWorkorders() {
      const box = document.getElementById("woList");
      const cnt = document.getElementById("woCount");
      try {
        const d = await (await fetch("/api/station/workorders")).json();
        const list = d.workorders || [];
        const open = list.filter(w => w.status !== "已解决").length;
        const sig = JSON.stringify(list);
        // 这块同样 5 秒重建一次。这里没有输入框，但按钮有：清单一变就把光标下那个节点 detach 掉，
        // 点下去就是"没反应"（真机复现过：报 Node is detached from document）。
        // 请求在飞的时候也不重建 —— 否则那张禁用中的按钮会凭空换一张，看着像没点上。
        if (sig === woSig || woBusy) {
          cnt.textContent = list.length ? `共 ${list.length} 条，未结 ${open} 条` : "暂无";
          return;
        }
        woSig = sig;
        cnt.textContent = list.length ? `共 ${list.length} 条，未结 ${open} 条` : "暂无";
        if (!list.length) {
          box.innerHTML = '<div class="woEmpty">还没有学生报障。学生确认上报后会落到这里。</div>';
          return;
        }
        box.innerHTML = "";
        list.slice(0, 20).forEach(w => {
          const st = w.status || "待处理";
          const el = document.createElement("div");
          el.className = "woItem";
          // 一律走 esc()（全站唯一转义来源）：kind/desc 都是学生写的话，不转义就是 XSS 入口
          el.innerHTML = `<div class="body">
            <div><span class="kind">${esc(w.kind || "其他问题")}</span>
              <span class="${woCls(st)}">${esc(st)}</span></div>
            <div>${esc(w.desc || "（学生没补充描述）")}</div>
            <div class="meta">${esc(w.ts || "")} · 来源 ${esc(w.source || "")} · 编号 ${esc(w.id || "")}</div>
          </div>`;
          const b = document.createElement("button");
          b.textContent = "改成「" + (WO_NEXT[st] || "待处理") + "」";
          b.addEventListener("click", async () => {
            b.disabled = true;
            woBusy = true;
            try {
              const r = await (await fetch("/api/station/workorders/"
                + encodeURIComponent(w.id || "") + "/status", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: WO_NEXT[st] || "待处理" }),
              })).json();
              if (r.error) addMsg("系统", "改状态没成功：" + r.error, "sys");
            } catch (e) {
              addMsg("系统", "改状态时网络出问题了", "sys");
            }
            woBusy = false;
            loadWorkorders();
          });
          el.appendChild(b);
          box.appendChild(el);
        });
      } catch (e) {
        cnt.textContent = "读取失败";
        woSig = null;   // 读失败后允许下次重建（同 svcSig 那条：不然这句报错会挂死）
        box.innerHTML = '<div class="woEmpty">读不到待处理问题（服务没起来？）</div>';
      }
    }
    document.getElementById("refreshWo").addEventListener("click", loadWorkorders);
    setInterval(loadWorkorders, 5000);
    loadWorkorders();

    // ---------- 低代码新增服务（#18 单子 3，创新点那块饼的落地处） ----------
    // 流程：管理员一句话 → POST /api/station/services → 模型**只产一份"服务定义"数据**
    // → 服务端过白名单校验（不合规直接 400，连库都不进）→ 立刻出现在下面这张表里、当场能登记。
    // ⚠️ 这里刻意没有"预览草稿再点保存"那一步：那要先存一份没收口的定义，
    //    等于给"半份服务"开门；现在能存在的定义都是过校验的，界面直接用它，演示也更直。
    let svcSig = null;   // 上一次真正渲染进 DOM 的清单（JSON 串）
    async function loadServices() {
      const box = document.getElementById("svcList");
      const cnt = document.getElementById("svcCount");
      try {
        const d = await (await fetch("/api/station/services")).json();
        const list = d.services || [];
        const sig = JSON.stringify(list);
        // 5 秒一次的轮询不许把管理员刚敲进登记表单的字抹掉：清单没变就不重建 DOM；
        // 变了但有人在填（有焦点或有内容）也先跳过，svcSig 不更新 → 填完下一轮自动补渲染。
        // 真机踩出来的：不挡就会在点【登记一条】那一瞬把按钮 detach 掉，提交直接失败。
        if (sig === svcSig || box.querySelector("input:focus, input:not(:placeholder-shown)")) return;
        svcSig = sig;
        cnt.textContent = `共 ${list.length} 项`;
        if (!list.length) { box.innerHTML = '<div class="woEmpty">还没有服务。</div>'; return; }
        box.innerHTML = "";
        list.forEach(s => {
          const el = document.createElement("div");
          el.className = "svc";
          const trig = (s.triggers || []).map(t => `<span class="pill">${esc(t)}</span>`).join("");
          const fields = (s.collect_fields || []).map(f => String(f));
          el.innerHTML = `<div><span class="nm">${esc(s.name || "未命名")}</span>
              <span class="tb">台账 ${esc(s.table || "-")} · id ${esc(String(s.id || ""))}</span></div>
            <div>${trig}</div>`;
          const form = document.createElement("form");
          const inputs = fields.map(f => {
            const i = document.createElement("input");
            i.placeholder = f;
            i.name = "f_" + f;
            i.required = true;
            form.appendChild(i);
            return { f: f, el: i };
          });
          const b = document.createElement("button");
          b.type = "submit";
          b.textContent = "登记一条";
          form.appendChild(b);
          const last = document.createElement("div");
          last.className = "last";
          form.addEventListener("submit", async ev => {
            ev.preventDefault();
            b.disabled = true;
            const payload = {};
            inputs.forEach(x => { payload[x.f] = x.el.value.trim(); });
            try {
              const r = await (await fetch("/api/station/services/"
                + encodeURIComponent(String(s.id || "")) + "/records", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fields: payload }),
              })).json();
              if (r.error) { last.style.color = "#cf1322"; last.textContent = "没登记成：" + r.error; }
              else {
                last.style.color = "#389e0d";
                last.textContent = (r.reply || "已登记。") + "（记录号 " + (r.record && r.record.id) + "）";
                inputs.forEach(x => { x.el.value = ""; });
              }
            } catch (e) {
              last.style.color = "#cf1322";
              last.textContent = "登记时网络出问题了";
            }
            b.disabled = false;
          });
          el.appendChild(form);
          el.appendChild(last);
          box.appendChild(el);
        });
      } catch (e) {
        cnt.textContent = "读取失败";
        svcSig = null;   // 读失败后必须允许下次重建，否则这句报错会一直挂着
        box.innerHTML = '<div class="woEmpty">读不到服务清单（服务没起来？）</div>';
      }
    }

    document.getElementById("refreshSvc").addEventListener("click", loadServices);
    document.getElementById("svcGo").addEventListener("click", async () => {
      const idea = document.getElementById("svcIdea");
      const btn = document.getElementById("svcGo");
      const txt = (idea.value || "").trim();
      if (!txt) { return; }
      btn.disabled = true;
      btn.textContent = "生成中…";
      try {
        const r = await (await fetch("/api/station/services", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ description: txt }),
        })).json();
        if (r.error) { addMsg("系统", "没能生成服务：" + r.error, "sys"); }
        else {
          addMsg("系统", `已新增服务「${r.service.name}」（id ${r.service.id}），`
            + `要收的字段：${(r.service.collect_fields || []).join("、")}。在上方那张表里就能直接登记。`,
            "sys");
          idea.value = "";
          loadServices();
        }
      } catch (e) {
        addMsg("系统", "生成服务时网络出问题了", "sys");
      }
      btn.disabled = false;
      btn.textContent = "生成服务";
    });
    setInterval(loadServices, 5000);
    loadServices();

    // ---------- 对话 ----------
    function addMsg(who, content, kind, trace, module) {
      const el = document.createElement("div");
      el.className = "msg " + (kind === "sys" ? "sys" : (who === "我" ? "user" : "bot"));
      let html = `<div class="who">${esc(who)}${module ? `<span class="tag">${esc(module)}</span>` : ""}</div>`;
      html += `<div class="bubble">${esc(content)}</div>`;
      if (trace && trace.length) {
        // 把 Agent 的思考轨迹铺开：能看到它调用了什么工具、拿到什么结果
        const lines = trace.map(t => {
          if (t.action) return `${t.phase || ""} ${t.action}(${JSON.stringify(t.args || {})})`;
          if (t.answer) return `${t.phase || ""} ${t.answer}`;
          return t.phase || "";
        }).join("\n");
        html += `<div class="trace">🧠 Agent 思考轨迹：\n${esc(lines)}</div>`;
      }
      el.innerHTML = html;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMsg(msg) {
      if (!msg.trim()) return;
      addMsg("我", msg);
      text.value = "";
      send.disabled = true;
      try {
        // 关键：显式带 module:"station"，后端就会用"客服人格 + 快递台账"这套配置来回答
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, module: "station" }),
        });
        const data = await resp.json();
        if (data.error) addMsg("客服", "出错了：" + data.error);
        else addMsg("客服", data.answer, "bot", data.trace, data.module);
      } catch (e) {
        addMsg("客服", "网络或接口异常：" + e.message);
      } finally {
        send.disabled = false;
      }
    }

    // ---------- 上传资料给客服读（比如一批待取清单） ----------
    const fileInput = document.getElementById("file");
    document.getElementById("attach").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", handleFile);

    async function handleFile() {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      addMsg("我", `📎 上传了资料：${f.name}`, "user");
      const form = new FormData();
      form.append("file", f);
      try {
        const r = await fetch("/api/upload", { method: "POST", body: form });
        const d = await r.json();
        if (d.ok) {
          addMsg("系统", `《${f.name}》已就位（${d.file.chars} 字）。可以让客服照着它干活了 —— 会以当前人格语气作答。`, "sys");
          chipsBox.innerHTML = "";
          ["照这份清单写一版取件提醒", "这里面有几件已经滞留了？", "帮我总结这份资料"].forEach(q => {
            const c = document.createElement("div");
            c.className = "chip";
            c.textContent = q;
            c.addEventListener("click", () => sendMsg(q));
            chipsBox.appendChild(c);
          });
        } else {
          addMsg("系统", "上传失败：" + (d.error || "未知原因"), "sys");
        }
      } catch (e) {
        addMsg("系统", "上传异常：" + e.message, "sys");
      }
      fileInput.value = "";
    }

    send.addEventListener("click", () => sendMsg(text.value));
    text.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(text.value); });

    // 进页面先读一次人格
    loadPersona();
  </script>
</body>
</html>
