<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>确认变更 · 校园时间管家</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f2f4fa; color: #2a3350;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  }
  /* 被学生端嵌进聊天流时：不要垂直居中和留白，紧凑贴着消息，
     看起来就像聊天流里的一条卡片（不是浮在页面上方的弹窗） */
  body.embed { min-height: auto; padding: 0; align-items: stretch; }
  body.embed .dlg {
    width: 100%; border-radius: 12px; box-shadow: none;
    border: 1px solid #e6ecfb;
  }
  body.embed .dlg-head { padding: 10px 14px; font-size: 14px; }
  body.embed .dlg-body { padding: 12px 14px; }
  body.embed .dlg-foot { padding: 8px 14px; }
  /* 作为独立页面打开时：把弹窗卡片摆在页面正中（跟嵌在聊天页里长得一样） */
  .dlg {
    width: min(460px, 100%); background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 48px rgba(20, 26, 45, .18);
  }
  .dlg-head {
    padding: 14px 18px; font-size: 15px; font-weight: 700; color: #2b4a8b;
    border-bottom: 1px solid #e6ecfb; background: #f4f8ff;
  }
  .dlg-head.danger { color: #c0392b; border-bottom-color: #f0e2e2; background: #fff6f6; }
  .dlg-body { padding: 16px 18px; font-size: 13px; line-height: 1.7; }
  .dlg-warn {
    background: #fff8ec; border: 1px solid #f5e3c8; border-radius: 10px;
    padding: 10px 12px; font-size: 12px; color: #8a6522; margin-top: 10px;
  }
  .summary { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: #223; }
  .meta { color: #6b7593; font-size: 12.5px; }
  ul.courses { margin: 8px 0 0; padding-left: 18px; }
  ul.courses li { margin: 2px 0; }
  .dlg-foot {
    display: flex; justify-content: flex-end; gap: 10px;
    padding: 12px 18px; border-top: 1px solid #eef1f8; background: #fafbff;
  }
  .dlg-btn {
    padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; border: 1px solid transparent;
  }
  .dlg-btn.ghost { background: #fff; border-color: #d8def0; color: #4a5675; }
  .dlg-btn.ghost:hover { background: #f3f5fb; }
  .dlg-btn.primary { background: #3a6ff0; color: #fff; }
  .dlg-btn.primary:hover { background: #2f5ed6; }
  .dlg-btn.danger { background: #e23a3a; color: #fff; }
  .dlg-btn.danger:hover { background: #c93030; }
  .dlg-btn:disabled { opacity: .55; cursor: not-allowed; }
  .empty { text-align: center; color: #7b86a3; padding: 10px 0 4px; }
  .done { text-align: center; padding: 8px 0 2px; }
  .done .big { font-size: 28px; }
  .back { margin-top: 12px; text-align: center; font-size: 12px; color: #7b86a3; }
  .back a { color: #3a6ff0; text-decoration: none; }

  /* 候选时段（勾时间）：每一行就是一个"可以排在这儿"的时刻。
     整行都可点（label 包着 checkbox），手机上手指点哪儿都行。 */
  .slots { margin: 10px 0 2px; }
  .slot {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    padding: 9px 11px; margin-bottom: 6px; border-radius: 10px;
    background: #f7f9ff; border: 1px solid #e6ecfb;
  }
  .slot:hover { background: #eef3ff; border-color: #cfdcfb; }
  .slot.on { background: #eaf1ff; border-color: #9fbcff; }
  .slot input { width: 15px; height: 15px; accent-color: #3a6ff0; cursor: pointer; }
  .slot-t { flex: 1; font-size: 13.5px; font-weight: 600; color: #24304f; }
  .slot-m { font-size: 11.5px; color: #8a93ab; white-space: nowrap; }
  /* 「其他时间」：学生自己写一句。这是学生明确要的口子——
     "这个选项可以由我来自行补充"，不给他这条路，几段候选不合意就只能放弃。 */
  .other { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e3e8f5; }
  .other-l { display: block; font-size: 12.5px; font-weight: 600; color: #4a5675; margin-bottom: 5px; }
  .other input {
    width: 100%; padding: 8px 11px; font-size: 13px; color: #2a3350;
    border: 1px solid #d8def0; border-radius: 9px; background: #fff;
    font-family: inherit;
  }
  .other input:focus { outline: none; border-color: #3a6ff0; box-shadow: 0 0 0 3px #e8efff; }
  .other-h { font-size: 11.5px; color: #8a93ab; margin-top: 5px; line-height: 1.6; }
</style>
</head>
<body>
<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
  <div class="dlg-head" id="cfTitle">确认这次变更</div>
  <div class="dlg-body" id="cfBody">
    <div class="empty">正在读取待确认的变更…</div>
  </div>
  <div class="dlg-foot">
    <button class="dlg-btn ghost" id="cfCancel">取消</button>
    <button class="dlg-btn primary" id="cfOk" disabled>确认</button>
  </div>
</div>

<script>
// ——————————————————————————————————————————————————————————
// 这是**单独的一个 UI 页面**（/confirm），专门用来做变更确认。
// 它有两个用法：
//   ① 直接打开 /confirm?session=xxx —— 学生能单独看到"这次要改什么"；
//   ② 被学生端聊天页用 iframe 载进**确认条**（贴在消息下面，不弹全屏遮罩）
//      —— 视觉与交互完全一致，只是尺寸收成一条。
//
// 铁律（跟后端一致，别在这里破例）：
//   · 本页只负责"把提案念清楚 + 把学生的按钮点下去"，自己不做任何数据加工；
//   · 真正写库的是那几个后端写入口（/api/timetable/apply、/api/todos、
//     /api/timetable/clear），本页只是去调它们；
//   · 点【取消】什么都不做：不调任何写入接口，数据原样保留。
// ——————————————————————————————————————————————————————————

const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (inFrame) document.body.classList.add("embed");

function tellParent(type, payload) {
  // 嵌在聊天页里时，用 postMessage 把结果告诉父页面，好让它刷新课表/待办面板
  if (!inFrame) return;
  try { window.parent.postMessage({ source: "campustime-confirm", type, ...payload }, "*"); } catch (e) {}
}

// 嵌在聊天流里时，把内容的真实高度报给父页面——
// 让它把 iframe 调成刚好装得下：不撑出一堆空白，也别把按钮挤出可视区。
// 注意量的是 body 的实际渲染高度，不是 documentElement.scrollHeight——
// 后者最小也等于 iframe 视口高度，量出来永远是"现在的高度"，等于白报。
function reportHeight() {
  if (!inFrame) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  try {
    window.parent.postMessage({ source: "campustime-confirm", type: "height", h }, "*");
  } catch (e) {}
}
if (inFrame && typeof ResizeObserver !== "undefined") {
  new ResizeObserver(() => reportHeight()).observe(document.body);
}

function params() { return new URLSearchParams(location.search); }
function sid() { return (params().get("session") || params().get("session_id") || "").trim(); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const headEl = document.getElementById("cfTitle");
const bodyEl = document.getElementById("cfBody");
const okBtn = document.getElementById("cfOk");
const cancelBtn = document.getElementById("cfCancel");

let current = null;   // 当前这份提案
let busy = false;

// 各类提案上确认按钮的文字（render 里要引用，先声明一个取值函数）
function k_confirm(p) { return (KIND[p.kind] || {}).confirm || "确认"; }

const KIND = {
  timetable_clear: {
    icon: "🗑️", title: "清空整张课表", confirm: "确认清空", danger: true,
    render(p) {
      return `<p class="summary">${esc(p.summary || "清空课表")}</p>
        <div class="meta">将删除当前周表里的 <b>${Number(p.clear_count || 0)}</b> 门课。</div>
        <div class="dlg-warn">清空后周表一门课都不剩，需要重新上传课表才能继续排课。<br>
          <b>课表和日程之外的东西（比如你的待办）不受影响。</b></div>`;
    },
    async apply(p) {
      return api("POST", "/api/timetable/clear",
        { session_id: sid(), confirm: true });
    },
    doneText(p, r) {
      const n = (r && r.removed != null) ? r.removed : Number(p.clear_count || 0);
      return `已清空 <b>${n}</b> 门课，周表现在是空的。`;
    },
  },
  timetable_change: {
    icon: "📚", title: "课表变更", confirm: "确认变更", danger: false,
    render(p) {
      const cs = Array.isArray(p.courses) ? p.courses : [];
      // 学生只要"确认/取消"两个字：一句话说清改了什么 + 变更后几门课，足够了。
      // 之前把整张新课表 11 门全列出来，弹窗被撑到一屏高，按钮都挤没了。
      return `<p class="summary">${esc(p.summary || "课表变更")}</p>
        <div class="meta">确认后周表共 <b>${cs.length}</b> 门课。</div>
        <div class="dlg-warn">点【${esc(k_confirm(p))}】才写入周表；点【取消】原封不动。</div>`;
    },
    async apply(p) {
      return api("POST", "/api/timetable/apply",
        { session_id: sid(), courses: p.courses });
    },
    doneText(p, r) {
      return `课表已更新，现在共 <b>${(r && r.count) || (p.courses || []).length}</b> 门课。`;
    },
  },
  todo_add: {
    icon: "📝", title: "加入日程（待办）", confirm: "确认加入", danger: false,
    render(p) {
      return `<p class="summary">${esc(p.title || "待办")}</p>
        <div class="meta">${esc(p.date)}（${esc(p.weekday || "")}）
          ${esc(p.start)}-${esc(p.end)}${p.minutes ? " · 约 " + Number(p.minutes) + " 分钟" : ""}</div>`;
    },
    async apply(p) {
      return api("POST", "/api/todos", {
        session_id: sid(), title: p.title, date: p.date,
        start: p.start, end: p.end,
      });
    },
    doneText(p) {
      return `已加入日程：<b>${esc(p.title)}</b>（${esc(p.date)} ${esc(p.start)}-${esc(p.end)}）。`;
    },
  },
  todo_pick: {
    icon: "📝", title: "加入日程（选定时段）", confirm: "确认加入", danger: false,
    render(p) {
      return `<p class="summary">${esc(p.title || "待办")}</p>
        <div class="meta">${esc(p.date)}（${esc(p.weekday || "")}）
          ${esc(p.start)}-${esc(p.end)}</div>`;
    },
    async apply(p) {
      return api("POST", "/api/todos", {
        session_id: sid(), title: p.title, date: p.date,
        start: p.start, end: p.end,
      });
    },
    doneText(p) {
      return `已加入日程：<b>${esc(p.title)}</b>（${esc(p.date)} ${esc(p.start)}-${esc(p.end)}）。`;
    },
  },
  // 删待办：跟清空课表同一个待遇——标红、说清"不可恢复"、把那条**原样念一遍**。
  // 学生必须能在这张条上看见"要删的到底是哪一条"（标题+日期+时段），
  // 而不是一句模糊的"确认删除吗"。这是规格里的"先列清楚，再动手"。
  todo_remove: {
    icon: "🗑️", title: "删除待办", confirm: "确认删除", danger: true,
    render(p) {
      return `<p class="summary">${esc(p.title || "待办")}</p>
        <div class="meta">${esc(p.date)}（${esc(p.weekday || "")}）
          ${esc(p.start)}-${esc(p.end)}${p.minutes ? " · 约 " + Number(p.minutes) + " 分钟" : ""}</div>
        <div class="dlg-warn"><b>删除之后找不回来。</b><br>
          点【确认删除】才真的删；点【取消】日程原封不动。</div>`;
    },
    async apply(p) {
      return api("DELETE", "/api/todos/" + encodeURIComponent(p.todo_id),
        { session_id: sid() });
    },
    doneText(p) {
      return `已删除：<b>${esc(p.title)}</b>（${esc(p.date)} ${esc(p.start)}-${esc(p.end)}），日程里已经没有它了。`;
    },
  },
  // 候选时段：**学生自己挑**（本轮规格的核心）。
  //
  // 为什么要有这一类：上一版是"系统替他挑一个点、出一张单条确认条"，学生原话驳回——
  //   「我定的太严了，你改一下，由 ai 帮我去挑选合适时间，**进行列举**，
  //    采用和删除课表时同样的弹框，内容变成那几个时间的选择或者其他
  //    （这个选项可以由我来自行补充），**由我打勾**，进行增加，
  //    增加确认完立刻刷新日程」
  // 所以这里三件事缺一不可：
  //   ① 把几段候选**列出来**（不是只给一个点）；
  //   ② 每段一个勾选框，**勾几个算几个**（可以一次排好几段）；
  //   ③ 一个「其他时间」的输入框，自己写也行（认不出时间会如实说，不瞎猜）。
  // 落库仍然只发生在按钮上：走 POST /api/todos/batch（逐条复核空档后写入）。
  todo_slots: {
    icon: "📝", title: "挑个时间加入日程", confirm: "加入日程", danger: false,
    render(p) {
      const ss = Array.isArray(p.slots) ? p.slots : [];
      const rows = ss.map((s, i) => `
        <label class="slot" data-i="${i}">
          <input type="checkbox" class="slot-cb" value="${i}">
          <span class="slot-t">${esc(s.label || ((s.date || "") + " " + (s.start || "") + "-" + (s.end || "")))}</span>
          ${s.minutes ? `<span class="slot-m">约 ${Number(s.minutes)} 分钟</span>` : ""}
        </label>`).join("");
      return `<p class="summary">${esc(p.title || "待办")}</p>
        <div class="meta">${esc(p.hint || "避开了课和已有的安排，挑一个方便的勾上（可以勾好几个）。")}</div>
        <div class="slots">${rows || '<div class="empty">没有可用的空档。</div>'}</div>
        <div class="other">
          <label class="other-l" for="cfOther">其他时间（自己写一个）</label>
          <input type="text" id="cfOther" placeholder="比如：周六下午三点到四点" autocomplete="off">
          <div class="other-h">几段都不合适？在这儿写一句也行。认不出时间我会直说，不会乱猜一个。</div>
        </div>`;
    },
    // 勾选 / 输入变了，按钮上的字跟着变（"+N 项"），学生一眼知道自己要写几条
    after() {
      bodyEl.querySelectorAll(".slot-cb").forEach(cb => {
        cb.addEventListener("change", () => {
          const row = cb.closest(".slot");
          if (row) row.classList.toggle("on", cb.checked);
          syncSlots();
        });
      });
      const inp = document.getElementById("cfOther");
      if (inp) inp.addEventListener("input", syncSlots);
      syncSlots();
    },
    async apply(p) {
      const picked = pickedSlots();
      const inp = document.getElementById("cfOther");
      const other = inp ? inp.value.trim() : "";
      if (!picked.length && !other) {
        throw new Error("还没选时间——勾一个，或者在「其他时间」里写一个");
      }
      return api("POST", "/api/todos/batch", {
        session_id: sid(), title: p.title, slots: picked, other,
      });
    },
    doneText(p, r) {
      // 后端会把"写进去哪几条、哪几条没写成、哪句没认出来"合成一句人话，
      // 原样显示比前端自己拼更准（前端不知道空档复核的结果）。
      if (r && r.message) return esc(r.message).replace(/\n/g, "<br>");
      return `已加入日程：<b>${esc(p.title)}</b>（${(r && r.count) || 0} 项）。`;
    },
  },
};

async function api(method, url, payload) {
  const r = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json" },
    body: payload ? JSON.stringify(payload) : undefined,
  });
  const text = await r.text();
  let data = {};
  try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
  if (!r.ok) throw new Error(data.error || data.detail || ("请求失败 " + r.status));
  return data;
}

// ———— 候选时段（todo_slots）专用的两个小工具 ————
// 学生勾了哪几段（人话：把打勾的行变回 date/start/end，交给后端去写）
function pickedSlots() {
  const ss = (current && Array.isArray(current.slots)) ? current.slots : [];
  const out = [];
  bodyEl.querySelectorAll(".slot-cb").forEach(cb => {
    if (!cb.checked) return;
    const s = ss[Number(cb.value)];
    if (s) out.push({ date: s.date, start: s.start, end: s.end });
  });
  return out;
}

// 按钮上的字跟着勾选变：勾了 2 段就写"加入日程（2 项）"，
// 一段没勾、也没自填 → 按钮置灰（点下去只会被后端顶回来，不如别让他点）
function syncSlots() {
  const n = pickedSlots().length;
  const inp = document.getElementById("cfOther");
  const typed = !!(inp && inp.value.trim());
  okBtn.textContent = n ? `加入日程（${n} 项）`
    : (typed ? "加入「其他时间」" : k_confirm(current));
  okBtn.disabled = !(n || typed);
}

function showDone(html) {
  headEl.classList.remove("danger");
  headEl.textContent = "✅ 已完成";
  bodyEl.innerHTML = `<div class="done"><div class="big">✅</div>
    <div style="margin-top:6px;font-size:13px;">${html}</div></div>`;
  okBtn.style.display = "none";
  cancelBtn.textContent = "关闭";
  reportHeight();
}

function showError(msg) {
  bodyEl.innerHTML = `<div class="empty">⚠️ ${esc(msg)}<br>
    <span style="font-size:12px;">数据没有改动，可以再试一次。</span></div>`;
  okBtn.disabled = false;
  // 按钮上的字要还原：刚才被改成"⏳ 执行中…"了，不还原学生看到的是一颗
  // 写着"执行中"的死按钮，不知道该不该再点（明明已经可以重试了）。
  okBtn.textContent = k_confirm(current);
  busy = false;
  reportHeight();
}

let fromParent = false;   // 提案是不是父页面直接递过来的（是的话就别再让接口结果覆盖它）

function render(p) {
  const k = p && KIND[p.kind];
  if (!k) {
    bodyEl.innerHTML = `<div class="empty">当前没有待确认的变更。<br>
      <span style="font-size:12px;">这个页面是"出了提案才弹出来"的——不是常驻的。<br>
      去<b>学生端聊天</b>里说一句「把课表全部删除」或「把今天的复习线代安排到 19:00」，<br>
      聊天里就会挂出一条确认条。</span><br><br>
      <a href="/student" style="display:inline-block;padding:8px 18px;border-radius:10px;
         background:#3a6ff0;color:#fff;text-decoration:none;font-size:13px;">← 去学生端发起</a></div>`;
    okBtn.disabled = true;
    okBtn.style.display = "none";
    tellParent("empty", {});
    reportHeight();
    return;
  }
  okBtn.style.display = "";
  current = p;
  headEl.textContent = k.icon + " " + k.title;
  headEl.classList.toggle("danger", !!k.danger);
  bodyEl.innerHTML = k.render(p);
  okBtn.textContent = k.confirm;
  okBtn.className = "dlg-btn " + (k.danger ? "danger" : "primary");
  okBtn.disabled = false;
  // 有些类目渲染完还要接线（候选时段要监听勾选/输入，好让按钮上的字数跟着变）。
  // 做成可选钩子而不是塞进 render：render 在别处也被当成"纯拼 HTML"用，
  // 让它顺手去挂事件容易出意外。
  if (typeof k.after === "function") k.after(p);
  tellParent("loaded", { kind: p.kind });
  reportHeight();
}

async function load() {
  const s = sid();
  if (!s) {
    bodyEl.innerHTML = `<div class="empty">缺少会话标识，无法读取待确认的变更。<br>
      <span style="font-size:12px;">请从学生端聊天里发起操作。</span></div>`;
    return;
  }
  let d;
  try {
    const r = await fetch("/api/pending/" + encodeURIComponent(s));
    d = await r.json();
  } catch (e) { showError("读取失败，请检查网络"); return; }
  if (fromParent) return;      // 父页面已经指定了要显示哪一张，以它为准
  render(d && d.pending);
}

okBtn.addEventListener("click", async () => {
  if (!current || busy) return;
  busy = true;
  okBtn.disabled = true;
  okBtn.textContent = "⏳ 执行中…";
  const k = KIND[current.kind];
  try {
    const r = await k.apply(current);
    showDone(k.doneText(current, r));
    // 通知父页面：写入成功，请刷新课表/待办面板
    tellParent("applied", { kind: current.kind });
  } catch (e) {
    showError(e.message || "执行失败");
  }
});

cancelBtn.addEventListener("click", () => {
  // 取消 = 什么都不做：不调任何写入接口，数据一根汗毛都不动
  tellParent("cancelled", { kind: current && current.kind });
  if (inFrame) return;                       // 嵌在聊天页里：交给父页面把确认条撤掉
  bodyEl.innerHTML = `<div class="empty">已取消，没有做任何改动。</div>
    <div class="back"><a href="/student">← 回到学生端</a></div>`;
  okBtn.style.display = "none";
  cancelBtn.style.display = "none";
});

// 父页面（学生端）会把**这次要确认哪一张**直接递过来：
// 一轮里出了好几张提案时，只有它知道该显示哪一张；单独打开时没有这个消息，就走接口读。
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.source !== "campustime-student") return;
  if (d.type === "pending" && d.pending) {
    fromParent = true;
    if (d.session) {
      const u = new URL(location.href);
      u.searchParams.set("session", d.session);
      history.replaceState(null, "", u.toString());
    }
    render(d.pending);
    return;
  }
  if (d.type === "session" && d.session) {
    const u = new URL(location.href);
    u.searchParams.set("session", d.session);
    history.replaceState(null, "", u.toString());
    load();
  }
});

// Esc 取消（独立页面打开时也能按 Esc）
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") cancelBtn.click();
});

load();
</script>
</body>
</html>
