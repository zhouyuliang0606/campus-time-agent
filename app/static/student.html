<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园时间管家 · 学生端</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fb; color: #1f2733;
    }
    header {
      background: linear-gradient(135deg, #4f7cff, #6a5cff);
      color: #fff; padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .9; font-size: 13px; }
    .wrap { max-width: 900px; margin: 18px auto; padding: 0 16px; }

    /* 四个模块导航卡片 */
    .modules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .mod {
      background: #fff; border: 2px solid #e6eaf5; border-radius: 14px;
      padding: 14px 10px; text-align: center; cursor: pointer; transition: .15s;
    }
    .mod:hover { transform: translateY(-2px); border-color: #4f7cff; }
    .mod.active { border-color: #4f7cff; background: #eef2ff; }
    .mod .ico { font-size: 26px; }
    .mod .nm { margin-top: 6px; font-size: 14px; font-weight: 600; }

    /* 校园通知：管理员在后台发布，学生在这里看到 */
    .notices {
      background: #fff; border-radius: 12px; margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(40,60,120,.08); overflow: hidden;
    }
    .notices-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .badge { background: #ff5c8a; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
    .notice-item { border-top: 1px solid #eef0f6; padding: 10px 16px; }
    .notice-item b { font-size: 14px; }
    .notice-item .body { font-size: 13px; color: #4a5366; margin-top: 4px; white-space: pre-wrap; }

    .hint { font-size: 13px; color: #6a7388; margin: 12px 2px 6px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; min-height: 4px; }
    .chip {
      background: #fff; border: 1px solid #d8def0; border-radius: 16px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: #4f7cff;
    }
    .chip:hover { background: #eef2ff; }

    #log {
      background: #fff; border-radius: 12px; padding: 16px;
      min-height: 300px; max-height: 440px; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(40,60,120,.08);
    }
    .msg { margin: 10px 0; }
    .msg .who { font-size: 12px; color: #8a93a6; margin-bottom: 3px; }
    .msg .bubble {
      display: inline-block; padding: 10px 14px; border-radius: 12px;
      line-height: 1.55; white-space: pre-wrap; max-width: 92%;
    }
    .user .bubble { background: #4f7cff; color: #fff; border-bottom-right-radius: 2px; }
    .bot .bubble { background: #f0f3fa; color: #1f2733; border-bottom-left-radius: 2px; }
    .sys .bubble { background: #fff7e6; color: #8a6d3b; border: 1px dashed #ffd591; font-size: 13px; }
    .trace {
      margin-top: 6px; font-size: 12px; color: #6a7388;
      background: #fafbff; border: 1px dashed #d8def0; border-radius: 8px;
      padding: 8px 10px; white-space: pre-wrap;
    }
    .inputbar { display: flex; gap: 10px; margin-top: 14px; }
    .inputbar input {
      flex: 1; padding: 12px 14px; border: 1px solid #d8def0; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    .inputbar button {
      padding: 0 22px; border: none; border-radius: 10px; cursor: pointer;
      background: #4f7cff; color: #fff; font-size: 14px;
    }
    .inputbar button:disabled { opacity: .6; cursor: not-allowed; }
    /* 回形针：上传资料给管家读 */
    .attach {
      padding: 0 14px; border: 1px solid #d8def0; background: #fff; color: #4f7cff;
      border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .attach:hover { background: #eef2ff; }
    .tag { display:inline-block; font-size:11px; background:#eef2ff; color:#4f7cff; border-radius:6px; padding:1px 6px; margin-left:6px;}

    /* 学生助手性格选择栏（自己挑一个聊天腔调，本地记住） */
    .persona-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: #fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(40,60,120,.06);
    }
    .persona-bar .lbl { font-size: 13px; color: #6a7388; margin-right: 2px; }
    .persona {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      border: 1.5px solid #d8def0; border-radius: 18px; padding: 5px 12px; font-size: 13px;
      background: #fff; color: #1f2733; transition: .15s; user-select: none;
    }
    .persona:hover { border-color: #4f7cff; }
    .persona.active { border-color: #4f7cff; background: #eef2ff; color: #3457d5; font-weight: 600; }
    .persona .em { font-size: 15px; }

    /* "正在思考…" 底部提示（取代思考轨迹） */
    .thinking {
      display: none; align-items: center; gap: 8px; margin: 4px 0 12px; font-size: 13px; color: #6a7388;
    }
    .thinking.show { display: flex; }
    .thinking .dots span {
      display: inline-block; width: 6px; height: 6px; margin: 0 1px; border-radius: 50%; background: #9aa6c0;
      animation: blink 1.2s infinite both;
    }
    .thinking .dots span:nth-child(2) { animation-delay: .2s; }
    .thinking .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

    /* 候选时间段卡片（可勾选） */
    .options { margin-top: 10px; border-top: 1px dashed #d8def0; padding-top: 10px; }
    .opt-card {
      display: flex; align-items: flex-start; gap: 10px; background: #f7f9ff; border: 1.5px solid #e1e7f7;
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: .15s;
    }
    .opt-card:hover { border-color: #4f7cff; }
    .opt-card.checked { border-color: #4f7cff; background: #eef2ff; }
    .opt-card input { margin-top: 3px; width: 16px; height: 16px; accent-color: #4f7cff; cursor: pointer; flex: none; }
    .opt-card .info { font-size: 13px; line-height: 1.5; }
    .opt-card .info b { color: #3457d5; }
    .opt-card .info .meta { color: #6a7388; font-size: 12px; margin-top: 2px; }
    .opt-hint { font-size: 12px; color: #6a7388; margin-bottom: 6px; }
    .confirm-btn {
      margin-top: 4px; padding: 8px 16px; border: none; border-radius: 10px; cursor: pointer;
      background: #4f7cff; color: #fff; font-size: 13px;
    }
    .confirm-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* 语音输入按钮 */
    .mic {
      padding: 0 14px; border: 1px solid #d8def0; background: #fff; color: #4f7cff;
      border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .mic:hover { background: #eef2ff; }
    .mic.recording { background: #ffe1e1; color: #e23a3a; border-color: #ffb3b3; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

    @media (max-width: 600px) { .modules { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>校园时间管家 · 学生端 <a href="/" style="font-size:13px;color:#fff;float:right;opacity:.9;text-decoration:none;">← 返回登录</a></h1>
    <p>一个入口办四件事：课表安排 · 校园问答 · 快递 · 外卖</p>
    <a href="/plan" style="float:right;margin-top:-26px;color:#fff;font-size:13px;opacity:.95;text-decoration:none;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px;">📅 我的日程 →</a>
  </header>

  <div class="wrap">
    <!-- 学生助手性格：自己挑一个聊天的腔调（选择本地记住，随对话发给后端） -->
    <div class="persona-bar" id="personaBar">
      <span class="lbl">🎭 助手性格：</span>
      <!-- 性格按钮由 JS 从 /api/student-personas 动态生成 -->
    </div>

    <!-- 校园通知（管理员在控制台发布，含附件可直接下载） -->
    <div class="notices">
      <div class="notices-head" id="noticesHead">
        <span>📢 校园通知</span>
        <span class="badge" id="noticeCount">0</span>
        <span class="small" id="noticesToggle" style="margin-left:auto;color:#8a93a6;font-weight:400;">展开 ▾</span>
      </div>
      <div id="noticeList" style="display:none;"></div>
    </div>

    <!-- 四个模块导航 -->
    <div class="modules" id="modules"></div>
    <div class="hint" id="hint">点上面的模块进入对应助手，或直接提问（我会自动识别意图）。</div>
    <div class="chips" id="chips"></div>

    <div id="log">
      <div class="msg bot">
        <div class="who">管家</div>
        <div class="bubble">你好，我是你的校园时间管家 👋 选一个模块开始，或直接说需求（比如"我有哪些快递待取？"）。</div>
      </div>
    </div>

    <!-- "正在思考…" 底部提示：替代原来的思考轨迹，等 AI 回话时显示 -->
    <div class="thinking" id="thinking">
      <span>🤖 正在思考…</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>

    <div class="inputbar">
      <input type="file" id="file" style="display:none;" />
      <button class="attach" id="attach" title="上传资料给管家读">📎</button>
      <button class="mic" id="mic" title="语音输入（中文）">🎤</button>
      <input id="text" placeholder="说点什么…（可点 🎤 语音输入）" />
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    // 四个模块的配置：名字、图标、示例问题
    const MODULES = {
      schedule: { name: "课表安排", ico: "🗓️", chips: ["我这周哪天有空复习高数？", "周三都有什么课？", "帮我排 3 小时复习线代，优先周二", "周五下午有空吗？"] },
      faq:      { name: "校园问答", ico: "❓", chips: ["图书馆几点关门？", "宿舍几点断电？", "校车在哪坐？", "怎么申请奖学金？"] },
      express:  { name: "快递",     ico: "📦", chips: ["我有哪些快递待取？", "取件码 B-5678 是什么？", "有没有滞留的快递？", "列出我所有快递"] },
      takeout:  { name: "外卖",     ico: "🍱", chips: ["我的外卖到哪了？", "有哪些待取的外卖？", "订单 T1 什么状态？", "去哪取我的外卖？"] },
    };

    let currentModule = null; // 当前选中的模块；null 表示让后端自动识别

    const log = document.getElementById("log");
    const text = document.getElementById("text");
    const send = document.getElementById("send");
    const chipsBox = document.getElementById("chips");
    const hint = document.getElementById("hint");

    // 渲染四个模块卡片
    const modBox = document.getElementById("modules");
    Object.entries(MODULES).forEach(([key, m]) => {
      const el = document.createElement("div");
      el.className = "mod";
      el.dataset.key = key;
      el.innerHTML = `<div class="ico">${m.ico}</div><div class="nm">${m.name}</div>`;
      el.addEventListener("click", () => selectModule(key));
      modBox.appendChild(el);
    });

    function selectModule(key) {
      currentModule = key;
      // 高亮当前卡片
      document.querySelectorAll(".mod").forEach(d => d.classList.toggle("active", d.dataset.key === key));
      hint.textContent = `已进入【${MODULES[key].name}】模块，问我吧～`;
      // 渲染该模块的示例问题
      chipsBox.innerHTML = "";
      MODULES[key].chips.forEach(q => {
        const c = document.createElement("div");
        c.className = "chip";
        c.textContent = q;
        c.addEventListener("click", () => sendMsg(q));
        chipsBox.appendChild(c);
      });
      addMsg("系统", `已切换到【${MODULES[key].name}】模块`, "sys");
    }

    function addMsg(who, content, kind, module) {
      const el = document.createElement("div");
      el.className = "msg " + (kind === "sys" ? "sys" : (who === "我" ? "user" : "bot"));
      let html = `<div class="who">${who}${module ? `<span class="tag">${module}</span>` : ""}</div>`;
      html += `<div class="bubble">${escapeHtml(content)}</div>`;
      // 注意：学生端**不展示** Agent 思考轨迹（避免吓到非技术评委）；
      // 取而代之的是底部「正在思考…」提示，藏在 sendMsg 里。
      el.innerHTML = html;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    // 把后端返回的候选时间段（options）渲染成可勾选卡片 + 「确认所选」按钮。
    // 学生勾选后点确认，前端把「确认：日期 起-止 标题」发回，后端识别到日期时间就真的写入日程。
    function renderOptions(container, options) {
      const wrap = document.createElement("div");
      wrap.className = "options";
      const hint = document.createElement("div");
      hint.className = "opt-hint";
      hint.textContent = "勾选你想要的时间，点「确认所选」即可排入日程：";
      wrap.appendChild(hint);

      const cards = [];
      options.forEach(o => {
        const card = document.createElement("label");
        card.className = "opt-card";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.addEventListener("change", () => card.classList.toggle("checked", cb.checked));
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML =
          `<b>${escapeHtml(o.title || "待办")}</b>` +
          `<div class="meta">${escapeHtml(o.date)}（${escapeHtml(o.weekday || "")}）` +
          ` ${escapeHtml(o.start)}-${escapeHtml(o.end)} · 约 ${o.minutes != null ? o.minutes : "?"} 分钟</div>`;
        card.appendChild(cb);
        card.appendChild(info);
        wrap.appendChild(card);
        cards.push({ cb, opt: o });
      });

      const btn = document.createElement("button");
      btn.className = "confirm-btn";
      btn.textContent = "✅ 确认所选";
      btn.addEventListener("click", () => {
        const picked = cards.filter(c => c.cb.checked).map(c => c.opt);
        if (!picked.length) { alert("先勾选至少一个时间段～"); return; }
        // 每个选中项拼成「确认 日期 起-止 标题」，后端（Mock/真模型）识别日期时间即写入
        const msg = picked.map(o => `确认 ${o.date} ${o.start}-${o.end} ${o.title || "待办"}`).join("\n");
        wrap.remove(); // 清掉卡片，避免重复提交
        sendMsg(msg);
      });
      wrap.appendChild(btn);
      container.appendChild(wrap);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    // 会话 id：和日程页共用同一个，后端靠它把几轮对话串起来，
    // 这样 AI 才记得住上一轮跟我们商量好的时间安排
    function sessionId() {
      let sid = localStorage.getItem("campustime_session");
      if (!sid) { sid = "s" + Math.random().toString(16).slice(2, 12); localStorage.setItem("campustime_session", sid); }
      return sid;
    }

    // 底部「正在思考…」指示器
    const thinkingEl = document.getElementById("thinking");
    function showThinking(show) { thinkingEl.classList.toggle("show", !!show); }

    async function sendMsg(msg) {
      if (!msg || !msg.trim()) return;
      addMsg("我", msg);
      text.value = "";
      send.disabled = true;
      showThinking(true); // 等待期间显示「正在思考…」，不展示内部轨迹
      try {
        const body = { message: msg, session_id: sessionId() };
        if (currentModule) body.module = currentModule; // 显式锁定模块
        // 随对话带上学生自选的助手性格（本地记住的 key）
        const pk = localStorage.getItem("campustime_persona");
        if (pk) body.persona = pk;
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        showThinking(false);
        if (data.error) addMsg("管家", "出错了：" + data.error);
        else {
          const el = addMsg("管家", data.answer, "bot", data.module);
          // 规划模块回了候选 → 渲染成可勾选卡片（学生点卡片才真正写入日程）
          if (data.options && data.options.length) renderOptions(el, data.options);
          logToAdmin(msg, data.module, data.answer); // 上报给管理员收件箱
        }
      } catch (e) {
        showThinking(false);
        addMsg("管家", "网络或接口异常：" + e.message);
      } finally {
        send.disabled = false;
      }
    }

    // 把学生这轮对话上报给管理员收件箱（异步、失败也不影响学生使用）
    function logToAdmin(message, module, answer) {
      fetch("/api/student-message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, module, answer }),
      }).catch(() => {});
    }

    // ---------- 校园通知（管理员发布，学生看到，含附件可下载） ----------
    // 这条链路补齐了「管理员发布 → 学生接收」的最后一段闭环
    let noticesOpen = false;
    async function loadNotices() {
      const box = document.getElementById("noticeList");
      try {
        const ns = (await (await fetch("/api/notices")).json()).notices || [];
        document.getElementById("noticeCount").textContent = ns.length;
        if (!ns.length) {
          box.innerHTML = '<div class="notice-item"><span class="small">暂无通知</span></div>';
          return;
        }
        box.innerHTML = ns.map(n => {
          const att = n.attachment
            ? `<div style="margin-top:6px;"><a class="chip" style="display:inline-block;text-decoration:none;" href="/api/uploads/${n.attachment.id}/download" target="_blank">📎 ${escapeHtml(n.attachment.name)}（下载）</a></div>`
            : "";
          return `<div class="notice-item">
            <b>${escapeHtml(n.title || "(无标题)")}</b> <span class="small">${n.ts}</span>
            <div class="body">${escapeHtml(n.content)}</div>${att}
          </div>`;
        }).join("");
      } catch (e) {
        box.innerHTML = '<div class="notice-item"><span class="small">通知加载失败</span></div>';
      }
    }
    document.getElementById("noticesHead").addEventListener("click", () => {
      noticesOpen = !noticesOpen;
      document.getElementById("noticeList").style.display = noticesOpen ? "block" : "none";
      document.getElementById("noticesToggle").textContent = noticesOpen ? "收起 ▴" : "展开 ▾";
    });

    // ---------- 上传资料给管家读 ----------
    // 流程：选文件 → POST /api/upload 存起来 → 管家之后就能用工具读到它的真实内容
    const fileInput = document.getElementById("file");
    document.getElementById("attach").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", handleFile);

    async function handleFile() {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      addMsg("我", `📎 上传了资料：${f.name}`, "user");
      const form = new FormData();
      form.append("file", f);
      try {
        const r = await fetch("/api/upload", { method: "POST", body: form });
        const d = await r.json();
        if (d.ok) {
          // 上传完给几个常见问题，让用户零思考就能用起来
          addMsg("系统", `《${f.name}》已就位（${d.file.chars} 字）。现在可以直接问它里面的内容了 —— 我会先读文件再回答，不会瞎编。`, "sys");
          chipsBox.innerHTML = "";
          ["这份资料讲了什么？", "帮我提炼重点", "里面有哪些需要注意的时间安排？"].forEach(q => {
            const c = document.createElement("div");
            c.className = "chip";
            c.textContent = q;
            c.addEventListener("click", () => sendMsg(q));
            chipsBox.appendChild(c);
          });
        } else {
          addMsg("系统", "上传失败：" + (d.error || "未知原因"), "sys");
        }
      } catch (e) {
        addMsg("系统", "上传异常：" + e.message, "sys");
      }
      fileInput.value = ""; // 清空，方便同一个文件再次上传触发 change
    }

    send.addEventListener("click", () => sendMsg(text.value));
    text.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(text.value); });

    // ---------- 学生助手性格选择栏（从后端拉三套预设，本地记住选择） ----------
    async function loadPersonas() {
      const bar = document.getElementById("personaBar");
      let personas = [];
      try {
        personas = (await (await fetch("/api/student-personas")).json()).personas || [];
      } catch (e) { return; }
      if (!personas.length) return;
      // 默认选中：上次选过的，或第一套（靠谱学长）
      const saved = localStorage.getItem("campustime_persona") || personas[0].key;
      localStorage.setItem("campustime_persona", saved);
      personas.forEach(p => {
        const b = document.createElement("span");
        b.className = "persona" + (p.key === saved ? " active" : "");
        b.dataset.key = p.key;
        b.title = p.desc || "";
        b.innerHTML = `<span class="em">${p.emoji || ""}</span>${escapeHtml(p.name)}`;
        b.addEventListener("click", () => {
          localStorage.setItem("campustime_persona", p.key);
          document.querySelectorAll(".persona").forEach(x => x.classList.toggle("active", x.dataset.key === p.key));
          addMsg("系统", `已切换为【${p.name}】风格，接下来我就用这个腔调和你聊～`, "sys");
        });
        bar.appendChild(b);
      });
    }

    // ---------- 语音输入（Web Speech API，中文；不支持则隐藏按钮） ----------
    function initVoice() {
      const mic = document.getElementById("mic");
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { mic.style.display = "none"; return; } // 浏览器不支持就直接隐藏
      const rec = new SR();
      rec.lang = "zh-CN";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      let recording = false;
      mic.addEventListener("click", () => { if (recording) rec.stop(); else { try { rec.start(); } catch (e) {} } });
      rec.onstart = () => { recording = true; mic.classList.add("recording"); };
      rec.onend = () => { recording = false; mic.classList.remove("recording"); };
      rec.onerror = (e) => {
        recording = false; mic.classList.remove("recording");
        if (e.error === "not-allowed") alert("麦克风权限被拒绝，请在浏览器允许后重试。");
      };
      rec.onresult = (ev) => {
        const txt = (ev.results && ev.results[0] && ev.results[0][0].transcript) || "";
        if (txt) { text.value = (text.value ? text.value + " " : "") + txt; text.focus(); }
      };
    }

    // 进页面拉一次通知，之后每 30 秒刷新（管理员新发的通知会自己冒出来）
    loadNotices();
    setInterval(loadNotices, 30000);
    // 拉性格预设并渲染选择栏；初始化语音输入
    loadPersonas();
    initVoice();
  </script>
</body>
</html>
