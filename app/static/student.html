<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园时间管家 · 学生端</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fb; color: #1f2733;
    }
    header {
      background: linear-gradient(135deg, #4f7cff, #6a5cff);
      color: #fff; padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .9; font-size: 13px; }
    .wrap { max-width: 900px; margin: 18px auto; padding: 0 16px; }

    /* 四个模块导航卡片 */
    .modules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .mod {
      background: #fff; border: 2px solid #e6eaf5; border-radius: 14px;
      padding: 14px 10px; text-align: center; cursor: pointer; transition: .15s;
    }
    .mod:hover { transform: translateY(-2px); border-color: #4f7cff; }
    .mod.active { border-color: #4f7cff; background: #eef2ff; }
    .mod .ico { font-size: 26px; }
    .mod .nm { margin-top: 6px; font-size: 14px; font-weight: 600; }

    /* 校园通知：管理员在后台发布，学生在这里看到 */
    .notices {
      background: #fff; border-radius: 12px; margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(40,60,120,.08); overflow: hidden;
    }
    .notices-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .badge { background: #ff5c8a; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
    .notice-item { border-top: 1px solid #eef0f6; padding: 10px 16px; }
    .notice-item b { font-size: 14px; }
    .notice-item .body { font-size: 13px; color: #4a5366; margin-top: 4px; white-space: pre-wrap; }

    .hint { font-size: 13px; color: #6a7388; margin: 12px 2px 6px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; min-height: 4px; }
    .chip {
      background: #fff; border: 1px solid #d8def0; border-radius: 16px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: #4f7cff;
    }
    .chip:hover { background: #eef2ff; }

    #log {
      background: #fff; border-radius: 12px; padding: 16px;
      min-height: 300px; max-height: 440px; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(40,60,120,.08);
    }
    .msg { margin: 10px 0; }
    .msg .who { font-size: 12px; color: #8a93a6; margin-bottom: 3px; }
    .msg .bubble {
      display: inline-block; padding: 10px 14px; border-radius: 12px;
      line-height: 1.55; white-space: pre-wrap; max-width: 92%;
    }
    .user .bubble { background: #4f7cff; color: #fff; border-bottom-right-radius: 2px; }
    .bot .bubble { background: #f0f3fa; color: #1f2733; border-bottom-left-radius: 2px; }
    .sys .bubble { background: #fff7e6; color: #8a6d3b; border: 1px dashed #ffd591; font-size: 13px; }
    .trace {
      margin-top: 6px; font-size: 12px; color: #6a7388;
      background: #fafbff; border: 1px dashed #d8def0; border-radius: 8px;
      padding: 8px 10px; white-space: pre-wrap;
    }
    .inputbar { display: flex; gap: 10px; margin-top: 14px; }
    .inputbar input {
      flex: 1; padding: 12px 14px; border: 1px solid #d8def0; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    .inputbar button {
      padding: 0 22px; border: none; border-radius: 10px; cursor: pointer;
      background: #4f7cff; color: #fff; font-size: 14px;
    }
    .inputbar button:disabled { opacity: .6; cursor: not-allowed; }
    /* 回形针：上传资料给管家读 */
    .attach {
      padding: 0 14px; border: 1px solid #d8def0; background: #fff; color: #4f7cff;
      border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .attach:hover { background: #eef2ff; }
    .tag { display:inline-block; font-size:11px; background:#eef2ff; color:#4f7cff; border-radius:6px; padding:1px 6px; margin-left:6px;}

    /* 学生助手性格选择栏（自己挑一个聊天腔调，本地记住） */
    .persona-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: #fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(40,60,120,.06);
    }
    .persona-bar .lbl { font-size: 13px; color: #6a7388; margin-right: 2px; }
    .persona {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      border: 1.5px solid #d8def0; border-radius: 18px; padding: 5px 12px; font-size: 13px;
      background: #fff; color: #1f2733; transition: .15s; user-select: none;
    }
    .persona:hover { border-color: #4f7cff; }
    .persona.active { border-color: #4f7cff; background: #eef2ff; color: #3457d5; font-weight: 600; }
    .persona .em { font-size: 15px; }

    /* "正在思考…" 底部提示（取代思考轨迹） */
    .thinking {
      display: none; align-items: center; gap: 8px; margin: 4px 0 12px; font-size: 13px; color: #6a7388;
    }
    .thinking.show { display: flex; }
    .thinking .dots span {
      display: inline-block; width: 6px; height: 6px; margin: 0 1px; border-radius: 50%; background: #9aa6c0;
      animation: blink 1.2s infinite both;
    }
    .thinking .dots span:nth-child(2) { animation-delay: .2s; }
    .thinking .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

    /* 候选时间段卡片（可勾选） */
    .options { margin-top: 10px; border-top: 1px dashed #d8def0; padding-top: 10px; }
    .opt-card {
      display: flex; align-items: flex-start; gap: 10px; background: #f7f9ff; border: 1.5px solid #e1e7f7;
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: .15s;
    }
    .opt-card:hover { border-color: #4f7cff; }
    .opt-card.checked { border-color: #4f7cff; background: #eef2ff; }
    .opt-card input { margin-top: 3px; width: 16px; height: 16px; accent-color: #4f7cff; cursor: pointer; flex: none; }
    .opt-card .info { font-size: 13px; line-height: 1.5; }
    .opt-card .info b { color: #3457d5; }
    .opt-card .info .meta { color: #6a7388; font-size: 12px; margin-top: 2px; }
    .opt-hint { font-size: 12px; color: #6a7388; margin-bottom: 6px; }
    .confirm-btn {
      margin-top: 4px; padding: 8px 16px; border: none; border-radius: 10px; cursor: pointer;
      background: #4f7cff; color: #fff; font-size: 13px;
    }
    .confirm-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* 遮罩弹窗：现在只有「清理聊天记录」在用；改日程的确认改成内嵌确认条了 */
    .mask {
      display: none; position: fixed; inset: 0; background: rgba(20, 26, 45, .45);
      z-index: 90; align-items: center; justify-content: center; padding: 20px;
    }
    .mask.show { display: flex; }
    /* 变更确认条：附着在聊天流里（不弹全屏遮罩），内容是 /confirm 独立页面 */
    .cf-inline { margin: 6px 0 10px; }
    /* 高度是兜底值：/confirm 载进来后会按内容真实高度回传，这里再被 JS 改掉 */
    .cf-frame {
      display: block; width: min(420px, 92%); height: 170px;
      border: 0; border-radius: 12px; background: #fff;
      box-shadow: 0 6px 18px rgba(20, 26, 45, .12);
    }
    .dlg {
      width: min(460px, 100%); background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 18px 48px rgba(20, 26, 45, .28);
    }
    .dlg-head {
      padding: 14px 18px; font-size: 15px; font-weight: 700; color: #c0392b;
      border-bottom: 1px solid #f0e2e2; background: #fff6f6;
    }
    .dlg-body { padding: 16px 18px; font-size: 13px; color: #333c52; line-height: 1.7; }
    .dlg-warn {
      background: #fff8ec; border: 1px solid #f5e3c8; border-radius: 10px;
      padding: 10px 12px; font-size: 12px; color: #8a6522;
    }
    .dlg-foot {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 12px 18px; border-top: 1px solid #eef1f8; background: #fafbff;
    }
    .dlg-btn {
      padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; border: 1px solid transparent;
    }
    .dlg-btn.ghost { background: #fff; border-color: #d8def0; color: #4a5675; }
    .dlg-btn.ghost:hover { background: #f3f5fb; }
    .dlg-btn.danger { background: #e23a3a; color: #fff; }
    .dlg-btn.danger:hover { background: #c93030; }
    .dlg-btn:disabled { opacity: .55; cursor: not-allowed; }

    /* 语音输入按钮 */
    .mic {
      padding: 0 14px; border: 1px solid #d8def0; background: #fff; color: #4f7cff;
      border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .mic:hover { background: #eef2ff; }
    .mic.recording { background: #ffe1e1; color: #e23a3a; border-color: #ffb3b3; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

    /* ============ 主显示面板：点卡片切换这里（不跳页），聊天框始终保留在下面 ============ */
    #panel { margin-top: 12px; }
    .view {
      display: none; background: #fff; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(40,60,120,.08); overflow: hidden;
    }
    .view-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      border-bottom: 1px solid #eef0f6; font-size: 14px; font-weight: 600;
    }
    .view-head .grow { flex: 1; }
    .view-head .close {
      border: 1px solid #d8def0; background: #fff; color: #6a7388; border-radius: 8px;
      padding: 4px 10px; font-size: 12px; cursor: pointer; font-weight: 400;
    }
    .view-head .close:hover { color: #e0414a; border-color: #f3c2c5; }
    .view-body { padding: 14px 16px; max-height: 430px; overflow-y: auto; }
    .empty { color: #8a93a6; font-size: 13px; text-align: center; padding: 16px; }

    /* ① 我的日程：周表 + 月表（精简版；完整版在 /plan） */
    .tab {
      padding: 6px 14px; border: 1px solid #d8def0; background: #fff; color: #4a5366;
      border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .tab.active { background: #4f7cff; color: #fff; border-color: #4f7cff; }
    .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .wk .wd { text-align: center; font-size: 12px; color: #8a93a6; padding: 2px 0; }
    .wk .wd.today { color: #4f7cff; font-weight: 700; }
    .wk .day {
      background: #fafbff; border: 1px solid #eef0f6; border-radius: 8px;
      min-height: 110px; padding: 4px;
    }
    .wk .day.today { border-color: #4f7cff; background: #f7faff; }
    .evt {
      font-size: 11px; border-left: 3px solid; border-radius: 4px;
      padding: 2px 5px; margin-top: 3px; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis;
    }
    .evt.course { background: #eaf1ff; border-color: #4f7cff; color: #24406e; }
    .evt.todo   { background: #fff5e6; border-color: #f0a03c; color: #7a5212; }
    .evt.todo.done { background: #eef7ef; border-color: #7dc48a; color: #3f6b48; text-decoration: line-through; }
    .evt .tm { opacity: .75; font-size: 10px; }
    .mcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .mcal .wd { text-align: center; font-size: 12px; color: #8a93a6; }
    .mcal .d {
      min-height: 64px; border: 1px solid #eef0f6; border-radius: 8px;
      padding: 3px 5px; font-size: 12px; cursor: pointer; position: relative; background: #fff;
    }
    .mcal .d:hover { border-color: #4f7cff; }
    .mcal .d.out { opacity: .35; }
    .mcal .d.today { border-color: #4f7cff; background: #f7faff; box-shadow: inset 0 0 0 1px #4f7cff; }
    .mcal .d.sel { background: #eef2ff; }
    .mcal .tdy { font-size: 10px; color: #4f7cff; font-weight: 700; }
    .mcal .more { font-size: 10px; color: #a0a8bb; margin-top: 1px; }

    /* ②③ 快递/外卖列表行 */
    .row {
      display: flex; align-items: center; gap: 10px; border: 1px solid #eef0f6;
      border-radius: 10px; padding: 9px 12px; margin-bottom: 8px;
    }
    .row .code { font-weight: 700; color: #3457d5; font-size: 15px; min-width: 68px; }
    .row .info { flex: 1; font-size: 13px; }
    .row .info .sub { color: #8a93a6; font-size: 12px; margin-top: 2px; }
    .st { display: inline-block; border-radius: 10px; padding: 2px 9px; font-size: 12px; color: #fff; flex: none; }
    .st.wait { background: #f0a03c; }
    .st.stay { background: #e0414a; }
    .st.done { background: #7dc48a; }
    .st.cook { background: #4f7cff; }
    .st.move { background: #8a6fe8; }

    /* 快递工单（本地记录，学生端无账号体系，与助手名字/性格同一套取舍） */
    .wo-form { border: 1px dashed #d8def0; border-radius: 10px; padding: 10px 12px; margin: 6px 0 14px; }
    .wo-form select, .wo-form textarea {
      width: 100%; font-size: 13px; border: 1px solid #d8def0; border-radius: 8px;
      padding: 7px 9px; margin-top: 6px; font-family: inherit; outline: none;
    }
    .wo-form button {
      margin-top: 8px; padding: 7px 16px; border: none; border-radius: 8px;
      background: #4f7cff; color: #fff; font-size: 13px; cursor: pointer;
    }
    .wo-item {
      display: flex; align-items: center; gap: 10px; border: 1px solid #eef0f6;
      border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px;
    }
    .wo-item .t { flex: 1; }
    .wo-item .t .sub { color: #8a93a6; font-size: 12px; margin-top: 2px; }
    .wo-item .mini {
      padding: 4px 10px; border: 1px solid #d8def0; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 12px; color: #4f7cff; flex: none;
    }

    /* ④ 校园问答：高频问题按钮墙 */
    .faq-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .faq-btn {
      border: 1.5px solid #d8def0; background: #fafbff; border-radius: 10px;
      padding: 10px 8px; font-size: 13px; cursor: pointer; text-align: center;
      color: #1f2733; transition: .15s;
    }
    .faq-btn:hover { border-color: #4f7cff; background: #eef2ff; color: #3457d5; }

    @media (max-width: 600px) {
      .modules { grid-template-columns: repeat(2, 1fr); }
      .faq-grid { grid-template-columns: 1fr; }
      .wk { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <!-- 头部用 flex 排：标题居左，两个入口按钮居右。
         之前用 float + 负 margin 让「完整日程」叠在标题行右侧，点击区域会被
         右浮的「设置」压住——点上去没反应。flex 布局后互不遮挡。 -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <h1 style="margin:0;font-size:20px;flex:1;">校园时间管家 · 学生端</h1>
      <a href="/plan" style="color:#fff;font-size:13px;text-decoration:none;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:8px;">📅 完整日程</a>
      <a href="/settings" style="color:#fff;font-size:13px;text-decoration:none;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:8px;" title="助手设置">⚙ 设置</a>
    </div>
    <p>一个入口办四件事：我的日程 · 校园问答 · 快递 · 外卖</p>
  </header>

  <div class="wrap">
    <!-- 校园通知（管理员在控制台发布，含附件可直接下载） -->
    <div class="notices">
      <div class="notices-head" id="noticesHead">
        <span>📢 校园通知</span>
        <span class="badge" id="noticeCount">0</span>
        <span class="small" id="noticesToggle" style="margin-left:auto;color:#8a93a6;font-weight:400;">展开 ▾</span>
      </div>
      <div id="noticeList" style="display:none;"></div>
    </div>

    <!-- 四个模块导航 -->
    <div class="modules" id="modules"></div>
    <div class="hint" id="hint">点上面的模块进入对应助手，或直接提问（我会自动识别意图）。</div>

    <!-- 主显示面板：点上面的卡片就切换这里的内容（不跳新页面），底部聊天框始终保留 -->
    <div id="panel">
      <!-- ① 我的日程：周表 + 月表（精简版，完整版去 /plan） -->
      <div class="view" id="view-schedule">
        <div class="view-head"><span>🗓️ 我的日程</span><span class="grow"></span><button class="close">收起面板 ✕</button></div>
        <div class="view-body">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
            <button class="tab active" id="tabWeek">周表</button>
            <button class="tab" id="tabMonth">月表</button>
            <span class="small" id="schRange" style="margin-left:4px;"></span>
            <span style="flex:1;"></span>
            <input type="file" id="ttFilePanel" style="display:none;" accept=".docx,.xlsx,.pptx,.pdf,.txt,.csv,.json,.md" />
            <button class="tab" id="uploadTtPanel" title="上传课表文件，管家读取后给出预览清单，确认后写进周表">📤 上传课表</button>
            <button class="tab" id="schPrev">←</button>
            <button class="tab" id="schNext">→</button>
            <a href="/plan" class="small" style="text-decoration:none;color:#4f7cff;">完整版日程 →</a>
          </div>
          <div class="small" id="ttPanelStatus" style="margin:-4px 0 8px;min-height:14px;"></div>
          <div id="schWeek"></div>
          <div id="schMonth" style="display:none;"></div>
          <div id="schDayDetail" style="display:none;margin-top:10px;"></div>
        </div>
      </div>

      <!-- 变更确认条：确认 UI 本身是**单独一个页面**（/confirm），
           这里只负责把它载进来，贴在出提案那条消息的下面——
           好处是确认这件事有了自己的 URL 和自己的代码，能单独打开、单独验收；
           而学生看到的不是浮在页面上方的全屏弹窗，就是聊天流里的一小条。
           出提案时由 openConfirm() 动态创建一条 .cf-inline，处理完整个拿掉。 -->

      <!-- ② 快递：包裹列表 + 工单提交与记录 -->
      <div class="view" id="view-express">
        <div class="view-head"><span>📦 我的快递</span><span class="grow"></span><button class="close">收起面板 ✕</button></div>
        <div class="view-body">
          <div id="expList"></div>
          <div class="wo-form">
            <b style="font-size:13px;">📨 快递有问题？提交个工单</b>
            <select id="woType">
              <option>快递没收到</option>
              <option>包裹破损</option>
              <option>取件码异常</option>
              <option>疑似丢件</option>
              <option>其他问题</option>
            </select>
            <textarea id="woDesc" rows="2" placeholder="简单描述一下情况（比如：取件码扫不开柜门）"></textarea>
            <button id="woSubmit">提交工单</button>
          </div>
          <b style="font-size:13px;">📋 我提交过的工单</b>
          <div id="woList" style="margin-top:8px;"></div>
        </div>
      </div>

      <!-- ③ 外卖：订单列表 -->
      <div class="view" id="view-takeout">
        <div class="view-head"><span>🍱 我的外卖</span><span class="grow"></span><button class="close">收起面板 ✕</button></div>
        <div class="view-body"><div id="tkList"></div></div>
      </div>

      <!-- ④ 校园问答：高频问题按钮墙（点按钮直接问管家） -->
      <div class="view" id="view-faq">
        <div class="view-head"><span>❓ 校园问答</span><span class="small" style="font-weight:400;">点按钮直接问管家</span><span class="grow"></span><button class="close">收起面板 ✕</button></div>
        <div class="view-body"><div class="faq-grid" id="faqGrid"></div></div>
      </div>
    </div>

    <div class="chips" id="chips"></div>

    <div id="log">
      <div class="msg bot">
        <div class="who" id="greetWho">管家</div>
        <div class="bubble" id="greetBubble">你好，我是你的校园时间管家 👋 选一个模块开始，或直接说需求（比如"我有哪些快递待取？"）。</div>
      </div>
    </div>

    <!-- "正在思考…" 底部提示：替代原来的思考轨迹，等 AI 回话时显示 -->
    <div class="thinking" id="thinking">
      <span>🤖 正在思考…</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>

    <div class="inputbar">
      <input type="file" id="file" style="display:none;" />
      <button class="attach" id="attach" title="上传资料给管家读">📎</button>
      <button class="mic" id="mic" title="语音输入（中文）">🎤</button>
      <button class="mic" id="clearChat" title="清空与管家的聊天记录">🧹</button>
      <input id="text" placeholder="说点什么…（可点 🎤 语音输入）" />
      <button id="send">发送</button>
    </div>

    <!-- 清空聊天记录确认弹窗：跟清空课表一个规矩，学生亲手点【清空】才会调后端 -->
    <div id="chatResetMask" class="mask">
      <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="chatResetTitle">
        <div class="dlg-head" id="chatResetTitle">🧹 清空与管家的聊天记录</div>
        <div class="dlg-body">
          <p id="chatResetSummary" style="margin:0 0 8px;line-height:1.6;"></p>
          <div class="dlg-warn">
            删掉的是<b>这段对话的记录</b>，清完就从新的一段对话开始。<br />
            <b>课表和日程不受影响</b>，已排进去的课和可待办都还在。
          </div>
        </div>
        <div class="dlg-foot">
          <button class="dlg-btn ghost" id="chatResetCancel">取消</button>
          <button class="dlg-btn danger" id="chatResetOk">清空记录</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 四个模块的配置：名字、图标、示例问题
    const MODULES = {
      schedule: { name: "我的日程", ico: "🗓️", chips: ["我这周哪天有空复习高数？", "周三都有什么课？", "帮我排 3 小时复习线代，优先周二", "周五下午有空吗？"] },
      faq:      { name: "校园问答", ico: "❓", chips: ["图书馆几点关门？", "宿舍几点断电？", "校车在哪坐？", "怎么申请奖学金？"] },
      express:  { name: "快递",     ico: "📦", chips: ["我有哪些快递待取？", "取件码 B-5678 是什么？", "有没有滞留的快递？", "列出我所有快递"] },
      takeout:  { name: "外卖",     ico: "🍱", chips: ["我的外卖到哪了？", "有哪些待取的外卖？", "订单 T1 什么状态？", "去哪取我的外卖？"] },
    };

    let currentModule = null; // 当前选中的模块；null 表示让后端自动识别

    const log = document.getElementById("log");
    const text = document.getElementById("text");
    const send = document.getElementById("send");
    const chipsBox = document.getElementById("chips");
    const hint = document.getElementById("hint");

    // 渲染四个模块卡片
    const modBox = document.getElementById("modules");
    Object.entries(MODULES).forEach(([key, m]) => {
      const el = document.createElement("div");
      el.className = "mod";
      el.dataset.key = key;
      el.innerHTML = `<div class="ico">${m.ico}</div><div class="nm">${m.name}</div>`;
      el.addEventListener("click", () => selectModule(key));
      modBox.appendChild(el);
    });

    function selectModule(key) {
      // 再点一次已选中的卡片 = 收起面板，回到"纯聊天"状态
      if (currentModule === key) { collapsePanel(); return; }
      currentModule = key;
      // 高亮当前卡片
      document.querySelectorAll(".mod").forEach(d => d.classList.toggle("active", d.dataset.key === key));
      hint.textContent = `已进入【${MODULES[key].name}】，上面是它的面板；也可以继续在聊天框问我～`;
      // 渲染该模块的示例问题
      chipsBox.innerHTML = "";
      MODULES[key].chips.forEach(q => {
        const c = document.createElement("div");
        c.className = "chip";
        c.textContent = q;
        c.addEventListener("click", () => sendMsg(q));
        chipsBox.appendChild(c);
      });
      // 切换主显示面板（不往聊天里塞"已切换"的系统消息——面板本身就是回应）
      showView(VIEW_OF[key]);
    }

    function addMsg(who, content, kind, module) {
      const el = document.createElement("div");
      el.className = "msg " + (kind === "sys" ? "sys" : (who === "我" ? "user" : "bot"));
      let html = `<div class="who">${who}${module ? `<span class="tag">${module}</span>` : ""}</div>`;
      html += `<div class="bubble">${richText(content)}</div>`;
      // 注意：学生端**不展示** Agent 思考轨迹（避免吓到非技术评委）；
      // 取而代之的是底部「正在思考…」提示，藏在 sendMsg 里。
      el.innerHTML = html;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    // ---- 变更确认条：写库动作唯一的发生地 ----
    // 铁律：只有确认条上的【确认】按钮（或聊天里回确认文字）会让后端真的写；
    // AI 出完提案就撒手了，它既调不到写入接口，也无权替学生决定。
    // 点【取消】→ 原封不动。
    // ---- 变更确认条：内容是 /confirm 这个**单独的 UI 页面**，但**附着在聊天框上** ----
    // 呈现形态按学生的要求来：不要全屏大弹窗，确认条就像一条消息一样
    // 嵌在聊天流里（出提案那条消息的下方），底下就是【取消】【确认】一小行。
    // 分工不变：/confirm 独立页面负责"念清楚变更 + 两个按钮"，写库仍由后端接口执行；
    // 这页只负责把它嵌进来 + 接住结果。
    let cfKind = null;          // 当前内嵌确认条对应的提案类型
    let cfPending = null;       // 当前内嵌确认条对应的提案
    let cfWrap = null;          // 当前内嵌确认条的容器（处理完要整个拿掉）

    function openConfirm(prop, container) {
      removeCfWrap();          // 上一次的确认条还没处理完又来新的 → 旧的先撤
      cfPending = prop;
      cfKind = prop && prop.kind;
      cfWrap = document.createElement("div");
      cfWrap.className = "cf-inline";
      const fr = document.createElement("iframe");
      fr.className = "cf-frame";
      fr.title = "变更确认";
      cfWrap.appendChild(fr);
      (container || log).appendChild(cfWrap);
      // 页面加载完再把提案塞过去（它自己也能从 /api/pending 读，这里是双保险：
      // 一轮出多张提案时，父页面知道该显示哪一张）
      fr.onload = () => {
        try {
          fr.contentWindow.postMessage(
            { source: "campustime-student", type: "pending", pending: prop, session: sessionId() },
            "*");
        } catch (e) {}
      };
      // 兜底：万一 /confirm 没载进来（网络异常、或环境不让用 iframe），
      // 退回内嵌确认卡——学生永远有路可走，不会因为确认条挂了就改不了日程。
      fr.addEventListener("error", () => {
        confirmPageOk = false;
        removeCfWrap();
      });
      fr.src = "/confirm?session=" + encodeURIComponent(sessionId()) + "&t=" + Date.now();
      log.scrollTop = log.scrollHeight;
    }

    function removeCfWrap() {
      if (cfWrap) { cfWrap.remove(); cfWrap = null; }
      cfKind = null; cfPending = null;
    }

    // 接住独立确认页回传的结果
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || d.source !== "campustime-confirm") return;
      if (d.type === "applied") {
        // ④ 入库成功后自动刷新课表/待办面板——学生不用手动刷新
        removeCfWrap();
        addMsg(botName(), "✅ 已经按你的确认改好了，日程已刷新。", "bot", "planner");
        loadScheduleView();
      } else if (d.type === "cancelled") {
        // 取消：清空课表这种高危提案必须通知后端作废（留着会变成后门），
        // 其余提案原样保留——学生随后在聊天里回一句"确认"还能接着执行。
        if (d.kind === "timetable_clear") abandonClear();
        else { removeCfWrap(); addMsg(botName(), "好的，已取消，没有做任何改动。", "bot", "planner"); }
      } else if (d.type === "empty") {
        removeCfWrap();     // 后端已经没有待确认的提案了（多半刚被执行过）
      } else if (d.type === "height") {
        // 独立页面报来它内容的真实高度 → 把 iframe 调成刚好装得下，
        // 既不撑出一堆空白，也不把底下那行【取消】【确认】挤出可视区。
        if (cfWrap && d.h) {
          const f = cfWrap.querySelector("iframe");
          if (f) f.style.height = Math.max(96, Math.min(430, Number(d.h) || 0)) + "px";
        }
      }
    });

    // 清空课表的「放弃」：不只是拿掉确认条，还要把后端那份提案作废——
    // 不然提案还挂着，谁再调一次删除接口课还是会被清掉。
    async function abandonClear() {
      try {
        await fetch("/api/timetable/clear", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId(), confirm: false, abandon: true }),
        });
      } catch (e) { /* 作废失败也不该卡住学生，下面照样按放弃处理 */ }
      removeCfWrap();
      addMsg(botName(), "好的，已放弃清空课表，周表现在还是老样子。", "bot", "planner");
    }

    // 兜底开关：确认页载不进来时，renderOptions 退回旧式内嵌确认卡
    let confirmPageOk = true;

    // 把后端返回的候选渲染成卡片。
    // 两种形态：① 候选时间段（可勾选，确认后发回聊天由 AI 写入待办）；
    // ② 课表修改提案（kind=timetable_change，单张确认卡，点确认直接调 /api/timetable/apply
    //    由系统写入——写入不经过 AI，从根上杜绝"确认了但数据没变"/"没有权限"的问题）；
    // ③ 清空课表提案（kind=timetable_clear，不走卡片，直接挂确认条，见上）。
    function renderOptions(container, options) {
      const wrap = document.createElement("div");
      wrap.className = "options";

      // ---- ③ 清空课表：挂确认条，不落卡片 ----
      const clears = options.filter(o => o.kind === "timetable_clear");
      if (clears.length) {
        const hint = document.createElement("div");
        hint.className = "opt-hint";
        hint.textContent = "🗑️ 清空课表是个大动作，在下面这条确认条上点【确认清空】我才会执行：";
        wrap.appendChild(hint);
        container.appendChild(wrap);
        openConfirm(clears[clears.length - 1], container);   // 确认条 = /confirm 独立页面，嵌在消息下方
        return;
      }

      // ---- ①-bis 待办确认卡：学生说"把 X 安排到今天 19:00-20:30"时系统算出来的那张 ----
      //     没有它学生就只能干等一句客服嘴上说的"已经加上"——实测复盘，日程里什么都没有。
      //     写入同样不经过 AI：点【确认加入】直接打 /api/todos，写完当场刷新日程面板。
      const adds = options.filter(o => o.kind === "todo_add");
      // 需求②：出提案后**优先唤起确认条**，展示变更内容 + 【确认】【取消】。
      // 单张提案才走确认条；一次好几张时仍用卡片，学生要挑是哪一张。
      if (confirmPageOk && adds.length === 1) {
        const hint = document.createElement("div");
        hint.className = "opt-hint";
        hint.textContent = "📝 要不要把这件事排进日程？在下面这条确认条上点【确认加入】我才会写：";
        wrap.appendChild(hint);
        container.appendChild(wrap);
        openConfirm(adds[adds.length - 1], container);
        return;
      }
      if (adds.length) {
        const hint = document.createElement("div");
        hint.className = "opt-hint";
        hint.textContent = "📝 要不要把这件事排进日程？点【确认加入】我才会写：";
        wrap.appendChild(hint);

        adds.forEach(card => {
          const box = document.createElement("div");
          box.className = "opt-card checked";
          box.innerHTML = `<div class="info"><b>${escapeHtml(card.title || "待办")}</b>` +
            `<div class="meta">${escapeHtml(card.date || "")}（${escapeHtml(card.weekday || "")}）` +
            ` ${escapeHtml(card.start || "")}-${escapeHtml(card.end || "")}` +
            ` · 约 ${card.minutes != null ? card.minutes : "?"} 分钟</div></div>`;
          wrap.appendChild(box);

          const go = document.createElement("button");
          go.className = "confirm-btn";
          go.textContent = "✅ 确认加入";
          go.style.marginTop = "6px";
          go.addEventListener("click", async () => {
            go.disabled = true;
            go.textContent = "⏳ 正在写入…";
            try {
              const r = await fetch("/api/todos", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  title: card.title, date: card.date,
                  start: card.start, end: card.end, note: card.note || "",
                  session_id: sessionId(),   // 好让"已加入日程"这句话进历史，刷新后还在
                }),
              });
              const d = await r.json();
              if (d.ok) {
                wrap.remove();
                addMsg(botName(),
                  `✅ 已加入日程：${card.title}｜${card.date}（${card.weekday}）${card.start}-${card.end}`,
                  "bot", "planner");
                loadScheduleView();   // 当场刷新，学生不用自己去刷新页面
              } else {
                go.disabled = false;
                go.textContent = "✅ 重试";
                addMsg(botName(), "写入失败：" + (d.error || "未知原因") + "，再试一次？");
              }
            } catch (e) {
              go.disabled = false;
              go.textContent = "✅ 重试";
              addMsg(botName(), "哎呀，网络好像开小差了，请再试一次～");
            }
          });
          wrap.appendChild(go);
        });

        const no = document.createElement("button");
        no.className = "confirm-btn";
        no.style.cssText = "background:#fff;color:#8a90a8;border:1px solid #d8def0;margin-top:6px";
        no.textContent = "✖ 不要了";
        no.addEventListener("click", () => {
          wrap.remove();
          addMsg(botName(), "好的，没排进日程，周日程保持原样。", "bot", "planner");
        });
        wrap.appendChild(no);
        container.appendChild(wrap);
        return;
      }

      // ---- ② 课表修改提案：高危操作，每张提案一个确认按钮（可能多张，点任意一张即应用） ----
      const tts = options.filter(o => o.kind === "timetable_change");
      // 同上：单张提案走确认条（/confirm 独立页面），多张时保留卡片让学生挑
      if (confirmPageOk && tts.length === 1) {
        const hint = document.createElement("div");
        hint.className = "opt-hint";
        hint.textContent = "🗓️ 课表修改提案（整表替换），在下面这条确认条上点【确认变更】才会生效：";
        wrap.appendChild(hint);
        container.appendChild(wrap);
        openConfirm(tts[tts.length - 1], container);
        return;
      }
      if (tts.length) {
        const hint = document.createElement("div");
        hint.className = "opt-hint";
        hint.textContent = tts.length > 1
          ? `🗓️ 有 ${tts.length} 张课表修改提案（整表替换），点选你要的那一张确认：`
          : "🗓️ 课表修改提案（整表替换，确认后立即生效）：";
        wrap.appendChild(hint);

        tts.forEach(tt => {
          const card = document.createElement("div");
          card.className = "opt-card checked";
          const info = document.createElement("div");
          info.className = "info";
          const n = (tt.courses || []).length;
          info.innerHTML = `<b>${escapeHtml(tt.summary || "修改课表")}</b>` +
            `<div class="meta">新课表共 ${n} 门课</div>`;
          card.appendChild(info);
          wrap.appendChild(card);

          const btn = document.createElement("button");
          btn.className = "confirm-btn";
          btn.style.marginTop = "6px";
          btn.textContent = "✅ 确认：" + (tt.summary || "修改课表").slice(0, 24);
          btn.addEventListener("click", async () => {
            wrap.querySelectorAll("button").forEach(x => { x.disabled = true; });
            btn.textContent = "⏳ 正在写入…";
            try {
              const r = await fetch("/api/timetable/apply", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                // 带上 session_id：学生如果在聊天框回一句"确认"，系统据此找到同一张卡，不会重复写入
                body: JSON.stringify({ courses: tt.courses, session_id: sessionId() }),
              });
              const d = await r.json();
              if (d.ok) {
                wrap.remove();
                addMsg(botName(), `✅ 课表已更新，共 ${d.count} 门课。周表/月表已刷新。`, "bot", "planner");
                loadScheduleView();
              } else {
                wrap.querySelectorAll("button").forEach(x => { x.disabled = false; });
                btn.textContent = "✅ 重试";
                addMsg(botName(), "写入失败：" + (d.error || "未知原因") + "。请再试一次，或让管家重新出提案。");
              }
            } catch (e) {
              wrap.querySelectorAll("button").forEach(x => { x.disabled = false; });
              btn.textContent = "✅ 重试";
              addMsg(botName(), "哎呀，网络好像开小差了，请稍后再试～");
            }
          });
          wrap.appendChild(btn);
        });
        container.appendChild(wrap);
        return;
      }

      // ---- ① 候选时间段：可勾选卡片 ----
      const hint = document.createElement("div");
      hint.className = "opt-hint";
      hint.textContent = "勾选你想要的时间，点「确认所选」即可排入日程：";
      wrap.appendChild(hint);

      const cards = [];
      options.forEach(o => {
        const card = document.createElement("label");
        card.className = "opt-card";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.addEventListener("change", () => card.classList.toggle("checked", cb.checked));
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML =
          `<b>${escapeHtml(o.title || "待办")}</b>` +
          `<div class="meta">${escapeHtml(o.date)}（${escapeHtml(o.weekday || "")}）` +
          ` ${escapeHtml(o.start)}-${escapeHtml(o.end)} · 约 ${o.minutes != null ? o.minutes : "?"} 分钟</div>`;
        card.appendChild(cb);
        card.appendChild(info);
        wrap.appendChild(card);
        cards.push({ cb, opt: o });
      });

      const btn = document.createElement("button");
      btn.className = "confirm-btn";
      btn.textContent = "✅ 确认所选";
      btn.addEventListener("click", () => {
        const picked = cards.filter(c => c.cb.checked).map(c => c.opt);
        if (!picked.length) { alert("先勾选至少一个时间段～"); return; }
        // 每个选中项拼成「确认 日期 起-止 标题」，后端（Mock/真模型）识别日期时间即写入
        const msg = picked.map(o => `确认 ${o.date} ${o.start}-${o.end} ${o.title || "待办"}`).join("\n");
        wrap.remove(); // 清掉卡片，避免重复提交
        sendMsg(msg);
      });
      wrap.appendChild(btn);
      container.appendChild(wrap);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    // 管家偶尔会用 **加粗** 强调一句重点（后端的确定性回复里也有）。
    // 聊天泡是"先转义再塞进 innerHTML"的，星号就被原样显示出来了——
    // 学生看到的是「要不要把 **游泳** 排进日程」，像 bug。
    // 所以转义之后再把 **x** 还原成 <b>x</b>（顺序不能反：先渲染再转义就等于开了 XSS 口子）。
    function richText(s) {
      return escapeHtml(s).replace(/\*\*([^*\n]{1,60})\*\*/g, "<b>$1</b>");
    }

    // 会话 id：和日程页共用同一个，后端靠它把几轮对话串起来，
    // 这样 AI 才记得住上一轮跟我们商量好的时间安排
    function sessionId() {
      let sid = localStorage.getItem("campustime_session");
      if (!sid) { sid = "s" + Math.random().toString(16).slice(2, 12); localStorage.setItem("campustime_session", sid); }
      return sid;
    }

    // 底部「正在思考…」指示器
    const thinkingEl = document.getElementById("thinking");
    function showThinking(show) { thinkingEl.classList.toggle("show", !!show); }

    async function sendMsg(msg, moduleOverride) {
      if (!msg || !msg.trim()) return;
      addMsg("我", msg);
      text.value = "";
      send.disabled = true;
      showThinking(true); // 等待期间显示「正在思考…」，不展示内部轨迹
      try {
        const body = { message: msg, session_id: sessionId() };
        // moduleOverride：个别动作（如导入课表）必须走 planner 模块，不受当前面板影响
        if (moduleOverride || currentModule) body.module = moduleOverride || currentModule;
        // 随对话带上学生自选的助手性格（本地记住的 key）
        const pk = localStorage.getItem("campustime_persona");
        if (pk) body.persona = pk;
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        showThinking(false);
        if (data.error) addMsg(botName(), "哎呀，管家这边遇到了点小状况，请稍后再试或换个说法～");
        else {
          const el = addMsg(botName(), data.answer, "bot", data.module);
          // 规划模块回了候选 → 渲染成可勾选卡片（学生点卡片才真正写入日程）
          if (data.options && data.options.length) renderOptions(el, data.options);
          // 课表可能在刚才这一轮里被改了（学生直接在聊天框回了"确认"），
          // 正在看的日程面板要刷成最新的，不然学生还会再来问"我怎么找不到"
          const sched = document.getElementById("view-schedule");
          if (sched && sched.style.display !== "none") loadScheduleView();
          // 人设规矩：普通对话不上报管理端，只有学生确认的工单才进管理端（见 submitWorkOrderToServer）
        }
      } catch (e) {
        showThinking(false);
        addMsg(botName(), "哎呀，网络好像开小差了，请稍后再试～");
      } finally {
        send.disabled = false;
      }
    }

    // ============ 主显示面板：卡片点击 → 切换视图（不跳页），聊天框始终保留在下面 ============
    // 面板里只做"展示 + 快捷提问"，所有 AI 对话仍走同一个 sendMsg，聊天业务逻辑零改动。
    const VIEW_OF = { schedule: "view-schedule", express: "view-express", takeout: "view-takeout", faq: "view-faq" };
    const FAQQS = [
      "图书馆几点关门？", "校车在哪坐、几点发车？", "教务系统网址是多少？怎么选课？",
      "宿舍晚上几点断电？", "食堂几点开饭？", "校医院在哪、门诊时间？",
      "怎么申请奖学金？", "学生证丢了怎么补办？", "校园网 WiFi 怎么连？", "快递驿站几点关门？",
    ];

    // title 属性里可能有引号，这里在 escapeHtml 基础上把双引号也转掉
    const escQ = s => escapeHtml(String(s)).replace(/"/g, "&quot;");

    function showView(name) {
      document.querySelectorAll("#panel .view").forEach(v => { v.style.display = "none"; });
      if (name && name !== "view-default") document.getElementById(name).style.display = "block";
      // 每次切进来都重新拉数据（比如刚在聊天里确认了待办，切回面板就能看到新的）
      if (name === "view-schedule") loadScheduleView();
      if (name === "view-express") loadExpressView();
      if (name === "view-takeout") loadTakeoutView();
      if (name === "view-faq") renderFaq();
    }

    // 收起面板：回到"纯聊天"状态（卡片取消高亮、示例问题清空）
    function collapsePanel() {
      currentModule = null;
      document.querySelectorAll(".mod").forEach(d => d.classList.remove("active"));
      hint.textContent = "点上面的模块进入对应助手，或直接提问（我会自动识别意图）。";
      chipsBox.innerHTML = "";
      showView("view-default");
    }
    document.querySelectorAll("#panel .close").forEach(b => b.addEventListener("click", collapsePanel));

    // ---- ① 我的日程：精简版周表 + 月表（数据与 /plan 同源，只读展示；管理去完整版） ----
    const WD = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    const isoD = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const isoWd = d => d.getDay() === 0 ? 7 : d.getDay();
    const minsOf = hhmm => { const [h, m] = String(hhmm).split(":").map(Number); return h * 60 + m; };
    function mondayOf(d) { const t = new Date(d); t.setDate(t.getDate() - (isoWd(d) - 1)); t.setHours(0, 0, 0, 0); return t; }

    let schTab = "week", schWeekOffset = 0, schMonthOffset = 0, schSelDate = null;
    let schCourses = [], schTodos = [];

    async function loadScheduleView() {
      try {
        const t = await (await fetch("/api/timetable")).json(); schCourses = t.courses || [];
        const td = await (await fetch("/api/todos")).json(); schTodos = td.todos || [];
      } catch (e) { /* 拉不到就按空数据渲染，不炸面板 */ }
      renderSchCurrent();
    }
    function renderSchCurrent() { if (schTab === "week") renderSchWeek(); else renderSchMonth(); }

    function renderSchWeek() {
      const base = mondayOf(new Date()); base.setDate(base.getDate() + schWeekOffset * 7);
      const days = []; for (let i = 0; i < 7; i++) { const d = new Date(base); d.setDate(d.getDate() + i); days.push(d); }
      const todayIso = isoD(new Date());
      document.getElementById("schRange").textContent =
        isoD(days[0]) + " ~ " + isoD(days[6]) + (schWeekOffset === 0 ? "（本周）" : "");
      let html = '<div class="wk">';
      days.forEach(d => {
        const dIso = isoD(d), wd = isoWd(d);
        // 一天的事件 = 课程（按星期匹配）+ 待办（按日期精确匹配），按开始时间排序
        const evts = [
          ...schCourses.filter(c => Number(c.day) === wd).map(c =>
            ({ s: minsOf(c.start), e: minsOf(c.end), cls: "course", name: c.course, tm: c.start + "-" + c.end, loc: c.location || "" })),
          ...schTodos.filter(t => t.date === dIso).map(t =>
            ({ s: minsOf(t.start), e: minsOf(t.end), cls: t.status === "done" ? "todo done" : "todo", name: t.title, tm: t.start + "-" + t.end, loc: "" })),
        ].filter(x => x.e > x.s).sort((a, b) => a.s - b.s);
        const inner = evts.map(x =>
          `<div class="evt ${x.cls}" title="${escQ(x.name)} ${x.tm}">` +
          `<span class="tm">${x.tm}</span> ${escapeHtml(x.name)}${x.loc ? " · " + escapeHtml(x.loc) : ""}</div>`).join("");
        html += `<div>
          <div class="wd ${dIso === todayIso ? "today" : ""}">${WD[wd - 1]}<br><span class="small">${d.getMonth() + 1}/${d.getDate()}</span></div>
          <div class="day ${dIso === todayIso ? "today" : ""}">${inner || '<div class="empty" style="padding:10px 2px;">无安排</div>'}</div>
        </div>`;
      });
      document.getElementById("schWeek").innerHTML = html + "</div>";
    }

    function renderSchMonth() {
      const now = new Date();
      const v = new Date(now.getFullYear(), now.getMonth() + schMonthOffset, 1);
      const y = v.getFullYear(), m = v.getMonth();
      document.getElementById("schRange").textContent = y + " 年 " + (m + 1) + " 月";
      const first = new Date(y, m, 1), startIdx = isoWd(first) - 1, dim = new Date(y, m + 1, 0).getDate();
      const byDate = {}; schTodos.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });
      const todayIso = isoD(now);
      let html = '<div class="mcal">' + WD.map(w => `<div class="wd">${w}</div>`).join("");
      for (let i = 0; i < startIdx; i++) html += '<div class="d out"></div>';
      for (let d = 1; d <= dim; d++) {
        const date = new Date(y, m, d);
        const dIso = isoD(date), wd = isoWd(date);
        const list = byDate[dIso] || [], isT = dIso === todayIso;
        // 与 /plan 月表同规则：像系统日历一样，每天格子直接列出课程+待办（面板格子窄，最多 2 条）
        const evts = [
          ...schCourses.filter(c => Number(c.day) === wd).map(c => ({ cls: "course", txt: `${c.start} ${c.course}` })),
          ...list.map(t => ({ cls: t.status === "done" ? "todo done" : "todo", txt: `${t.start} ${t.title}` })),
        ];
        let inner = `<div>${d}${isT ? ' <span class="tdy">今天</span>' : ""}</div>`;
        evts.slice(0, 2).forEach(e => { inner += `<div class="evt ${e.cls}" title="${escQ(e.txt)}">${escapeHtml(e.txt)}</div>`; });
        if (evts.length > 2) inner += `<div class="more">还有 ${evts.length - 2} 项…</div>`;
        html += `<div class="d ${isT ? "today" : ""} ${dIso === schSelDate ? "sel" : ""}" data-date="${dIso}">${inner}</div>`;
      }
      document.getElementById("schMonth").innerHTML = html + "</div>";
      document.querySelectorAll("#schMonth .d[data-date]").forEach(el =>
        el.addEventListener("click", () => { schSelDate = el.dataset.date; renderSchMonth(); renderSchDay(); }));
      renderSchDay();
    }

    function renderSchDay() {
      const box = document.getElementById("schDayDetail");
      if (!schSelDate) { box.innerHTML = '<div class="empty">点月历里任意一天，看当天安排</div>'; return; }
      const list = schTodos.filter(t => t.date === schSelDate).sort((a, b) => a.start.localeCompare(b.start));
      box.innerHTML = list.length
        ? `<b style="font-size:13px;">${schSelDate} 的待办</b>` + list.map(t =>
            `<div class="evt todo ${t.status === "done" ? "done" : ""}" style="font-size:12px;margin-top:6px;white-space:normal;">${t.start}-${t.end} ${escapeHtml(t.title)}</div>`).join("")
        : `<div class="empty">${schSelDate} 还没有待办</div>`;
    }

    document.getElementById("tabWeek").addEventListener("click", () => { schTab = "week"; setSchTab(); });
    document.getElementById("tabMonth").addEventListener("click", () => { schTab = "month"; setSchTab(); });
    function setSchTab() {
      document.getElementById("tabWeek").classList.toggle("active", schTab === "week");
      document.getElementById("tabMonth").classList.toggle("active", schTab === "month");
      document.getElementById("schWeek").style.display = schTab === "week" ? "block" : "none";
      document.getElementById("schMonth").style.display = schTab === "month" ? "block" : "none";
      document.getElementById("schDayDetail").style.display = schTab === "month" ? "block" : "none";
      renderSchCurrent();
    }
    document.getElementById("schPrev").addEventListener("click", () => { if (schTab === "week") schWeekOffset--; else schMonthOffset--; renderSchCurrent(); });
    document.getElementById("schNext").addEventListener("click", () => { if (schTab === "week") schWeekOffset++; else schMonthOffset++; renderSchCurrent(); });

    // 给管家的导入指令（面板上传与聊天上传共用同一段话）：
    // 人设规矩是"预览确认制"——管家先读文件、给课程预览清单，学生确认后才真正写入周表
    function timetableImportMsg(name, chars) {
      return `我上传了一份课表文件《${name}》（共 ${chars} 字）。请先用 read_uploaded_file 读取内容，` +
        `把解析出的课程整理成**预览清单**给我看（星期、时间、课程名、地点；"第几节"这类表述` +
        `按学校常见上课时间换算成 HH:MM，day 用 1=周一 到 7=周日）。` +
        `先不要写入周表，等我确认后再导入。`;
    }

    // 面板里直接上传课表：上传文件 → 发给管家（planner 模块）→ 结果进聊天 + 刷新周月表
    document.getElementById("uploadTtPanel").addEventListener("click", () =>
      document.getElementById("ttFilePanel").click());
    document.getElementById("ttFilePanel").addEventListener("change", async () => {
      const f = document.getElementById("ttFilePanel").files[0];
      if (!f) return;
      const st = document.getElementById("ttPanelStatus");
      st.textContent = "⏳ 正在上传并让管家读课表…（要读文件，稍等几秒）";
      const form = new FormData();
      form.append("file", f);
      try {
        const up = await (await fetch("/api/upload", { method: "POST", body: form })).json();
        if (!up.ok) { st.textContent = "❌ 上传失败：" + (up.error || ""); return; }
        const body = {
          message: timetableImportMsg(up.file.name, up.file.chars),
          module: "planner",
          session_id: sessionId(),
        };
        const pk = localStorage.getItem("campustime_persona");
        if (pk) body.persona = pk;
        const d = await (await fetch("/api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })).json();
        st.textContent = d.answer ? "管家已给出课表预览，请在下方聊天里确认后再导入" : "已请求管家读取课表";
        // 同步留痕到聊天框：这段"管家帮我导课表"的对话学生能翻到
        addMsg("我", `📤 上传课表《${f.name}》，请管家读取并给我预览清单`, "user");
        addMsg(botName(), d.answer || "已收到课表，正在读取。", "bot", "planner");
        // 按人设规矩：导入课表属于规划操作，不上报管理端；学生确认后才会真正写入
      } catch (e) {
        st.textContent = "哎呀，网络好像开小差了，请稍后再试";
      }
      document.getElementById("ttFilePanel").value = "";
    });

    // ---- ② 快递：包裹列表 + 工单（工单记录存 localStorage，学生端无账号体系） ----
    async function loadExpressView() {
      const box = document.getElementById("expList");
      try {
        const d = await (await fetch("/api/express")).json();
        const pkgs = d.packages || [];
        box.innerHTML = pkgs.length ? pkgs.map(p => {
          const cls = p.label === "滞留" ? "stay" : (p.label === "已取" ? "done" : "wait");
          const stay = p.label === "滞留" ? `（已 ${p.stay_days} 天）` : "";
          return `<div class="row">
            <span class="st ${cls}">${p.label}${stay}</span>
            <span class="code">${escapeHtml(p.pickup_code)}</span>
            <span class="info">${escapeHtml(p.item)}<div class="sub">${escapeHtml(p.station)} · 到件 ${p.arrived_at}</div></span>
          </div>`;
        }).join("") : '<div class="empty">暂无快递记录</div>';
      } catch (e) { box.innerHTML = '<div class="empty">快递数据加载失败</div>'; }
      renderWorkOrders();
    }

    function myWorkOrders() {
      try { return JSON.parse(localStorage.getItem("campustime_workorders") || "[]"); }
      catch (e) { return []; }
    }
    function renderWorkOrders() {
      const list = myWorkOrders().slice().reverse(); // 最新在前
      const box = document.getElementById("woList");
      box.innerHTML = list.length ? list.map(w => `
        <div class="wo-item">
          <span class="st wait">已提交</span>
          <span class="t">${escapeHtml(w.type)}<div class="sub">${escapeHtml(w.desc || "（无补充描述）")} · ${w.ts}</div></span>
          <button class="mini" data-wo="${escQ(w.id)}">让管家跟进</button>
        </div>`).join("") : '<div class="empty">还没有提交过工单</div>';
      box.querySelectorAll(".mini").forEach(b => b.addEventListener("click", () => {
        const w = myWorkOrders().find(x => x.id === b.dataset.wo);
        if (w) sendMsg(`我的快递工单（${w.ts} 提交）：${w.type} —— ${w.desc || "无补充描述"}。请帮我跟进处理。`);
      }));
    }
    document.getElementById("woSubmit").addEventListener("click", async () => {
      const type = document.getElementById("woType").value;
      const desc = document.getElementById("woDesc").value.trim();
      const list = myWorkOrders();
      const item = {
        id: "w" + Date.now(),
        ts: new Date().toLocaleString("zh-CN", { hour12: false }),
        type,
        desc,
        status: "已提交",
      };
      list.push(item);
      localStorage.setItem("campustime_workorders", JSON.stringify(list));
      document.getElementById("woDesc").value = "";
      renderWorkOrders();
      // 同步上报服务端：管理端（/admin）能看到这条工单记录并跟进处理
      try {
        const r = await fetch("/api/workorders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: type, desc, source: "panel" }),
        });
        const d = await r.json();
        if (d.ok) item.serverId = d.workorder.id;
        localStorage.setItem("campustime_workorders", JSON.stringify(list));
      } catch (e) { /* 上报失败不影响本地记录，下次「让管家跟进」还能补报 */ }
    });

    // ---- ③ 外卖：订单列表 ----
    async function loadTakeoutView() {
      const box = document.getElementById("tkList");
      try {
        const d = await (await fetch("/api/takeout")).json();
        const orders = d.orders || [];
        box.innerHTML = orders.length ? orders.map(o => {
          const cls = o.status === "制作中" ? "cook" : (o.status === "配送中" ? "move" : "wait");
          return `<div class="row">
            <span class="st ${cls}">${escapeHtml(o.status)}</span>
            <span class="info"><b>${escapeHtml(o.shop)}</b> · ${escapeHtml(o.items)}
              <div class="sub">预计 ${o.eta} · ${escapeHtml(o.pickup_point)}${o.pickup_code ? " · 取餐码 " + escapeHtml(o.pickup_code) : ""}</div></span>
          </div>`;
        }).join("") : '<div class="empty">暂无外卖订单</div>';
      } catch (e) { box.innerHTML = '<div class="empty">外卖数据加载失败</div>'; }
    }

    // ---- ④ 校园问答：高频问题按钮墙（点击即发送，答案从知识库检索） ----
    function renderFaq() {
      const g = document.getElementById("faqGrid");
      if (g.dataset.done) return; // 只渲染一次
      g.innerHTML = FAQQS.map(q => `<button class="faq-btn">${escapeHtml(q)}</button>`).join("");
      g.querySelectorAll(".faq-btn").forEach((b, i) => b.addEventListener("click", () => sendMsg(FAQQS[i])));
      g.dataset.done = "1";
    }

    // ---------- 校园通知（管理员发布，学生看到，含附件可下载） ----------
    // 这条链路补齐了「管理员发布 → 学生接收」的最后一段闭环
    let noticesOpen = false;
    async function loadNotices() {
      const box = document.getElementById("noticeList");
      try {
        const ns = (await (await fetch("/api/notices")).json()).notices || [];
        document.getElementById("noticeCount").textContent = ns.length;
        if (!ns.length) {
          box.innerHTML = '<div class="notice-item"><span class="small">暂无通知</span></div>';
          return;
        }
        box.innerHTML = ns.map(n => {
          const att = n.attachment
            ? `<div style="margin-top:6px;"><a class="chip" style="display:inline-block;text-decoration:none;" href="/api/uploads/${n.attachment.id}/download" target="_blank">📎 ${escapeHtml(n.attachment.name)}（下载）</a></div>`
            : "";
          return `<div class="notice-item">
            <b>${escapeHtml(n.title || "(无标题)")}</b> <span class="small">${n.ts}</span>
            <div class="body">${escapeHtml(n.content)}</div>${att}
          </div>`;
        }).join("");
      } catch (e) {
        box.innerHTML = '<div class="notice-item"><span class="small">通知加载失败</span></div>';
      }
    }
    document.getElementById("noticesHead").addEventListener("click", () => {
      noticesOpen = !noticesOpen;
      document.getElementById("noticeList").style.display = noticesOpen ? "block" : "none";
      document.getElementById("noticesToggle").textContent = noticesOpen ? "收起 ▴" : "展开 ▾";
    });

    // ---------- 上传资料给管家读 ----------
    // 流程：选文件 → POST /api/upload 存起来 → 管家之后就能用工具读到它的真实内容
    const fileInput = document.getElementById("file");
    document.getElementById("attach").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", handleFile);

    async function handleFile() {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      addMsg("我", `📎 上传了资料：${f.name}`, "user");
      const form = new FormData();
      form.append("file", f);
      try {
        const r = await fetch("/api/upload", { method: "POST", body: form });
        const d = await r.json();
        if (d.ok) {
          // 上传完给几个常见问题，让用户零思考就能用起来
          addMsg("系统", `《${f.name}》已就位（${d.file.chars} 字）。现在可以直接问它里面的内容了 —— 我会先读文件再回答，不会瞎编。`, "sys");
          chipsBox.innerHTML = "";
          ["这份资料讲了什么？", "帮我提炼重点", "里面有哪些需要注意的时间安排？"].forEach(q => {
            const c = document.createElement("div");
            c.className = "chip";
            c.textContent = q;
            c.addEventListener("click", () => sendMsg(q));
            chipsBox.appendChild(c);
          });
          // 课表文件快捷入口：管家读文件 → 出「确认修改」卡片 → 学生点确认 → 系统写入周表（固定走 planner 模块）
          const ic = document.createElement("div");
          ic.className = "chip";
          ic.style.borderColor = "#4f7cff";
          ic.textContent = "📅 让管家读取这份课表";
          ic.addEventListener("click", () => sendMsg(timetableImportMsg(d.file.name, d.file.chars), "planner"));
          chipsBox.appendChild(ic);
        } else {
          addMsg("系统", "上传失败：" + (d.error || "未知原因"), "sys");
        }
      } catch (e) {
        addMsg("系统", "上传异常：" + e.message, "sys");
      }
      fileInput.value = ""; // 清空，方便同一个文件再次上传触发 change
    }

    send.addEventListener("click", () => sendMsg(text.value));
    text.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(text.value); });

    // 助手名字：本地记住（设置页里改），默认「管家」
    function botName() {
      return localStorage.getItem("campustime_name") || "管家";
    }

    // ---------- 语音输入（Web Speech API，中文；不支持则隐藏按钮） ----------
    function initVoice() {
      const mic = document.getElementById("mic");
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { mic.style.display = "none"; return; } // 浏览器不支持就直接隐藏
      const rec = new SR();
      rec.lang = "zh-CN";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      let recording = false;
      mic.addEventListener("click", () => { if (recording) rec.stop(); else { try { rec.start(); } catch (e) {} } });
      rec.onstart = () => { recording = true; mic.classList.add("recording"); };
      rec.onend = () => { recording = false; mic.classList.remove("recording"); };
      rec.onerror = (e) => {
        recording = false; mic.classList.remove("recording");
        if (e.error === "not-allowed") alert("麦克风权限被拒绝，请在浏览器允许后重试。");
      };
      rec.onresult = (ev) => {
        const txt = (ev.results && ev.results[0] && ev.results[0][0].transcript) || "";
        if (txt) { text.value = (text.value ? text.value + " " : "") + txt; text.focus(); }
      };
    }

    // 进页面拉一次通知，之后每 30 秒刷新（管理员新发的通知会自己冒出来）
    loadNotices();
    setInterval(loadNotices, 30000);
    // 用本地保存的助手名字刷新开场白（名字在设置页里改）
    (function refreshGreeting() {
      const n = botName();
      const who = document.getElementById("greetWho");
      const bubble = document.getElementById("greetBubble");
      if (who) who.textContent = n;
      if (bubble) bubble.textContent = `你好，我是你的${n} 👋 选一个模块开始，或直接说需求（比如"我有哪些快递待取？"）。`;
    })();
    // ---------- 会话历史恢复（人话：刷新页面，聊过的话还得在） ----------
    // 之前这个页面只管往 sessions.json 里写、从来不读回来，学生一刷新就只剩开场白，
    // 刚才跟管家敲定的时间、商量的进度整个消失，只能从头再问一遍。
    // 这些话本来就被 append_conversation 老老实实存着，只是没人去读它。
    async function restoreHistory() {
      let data;
      try {
        const r = await fetch("/api/conversation/" + encodeURIComponent(sessionId()));
        data = await r.json();
      } catch (e) { return; }
      const msgs = data.messages || [];
      for (const m of msgs) {          // 开场白是 system 的，不重复渲染
        if (!m || m.role === "system") continue;
        const who = m.role === "user" ? "我" : botName();
        addMsg(who, m.content || "", m.role === "user" ? "user" : "bot");
      }
    }

    // ---------- 清空与管家的聊天记录 ----------
    // 规矩跟清空课表一模一样：只有学生亲手点【清空记录】才会去调后端，
    // AI 既调不到这个接口，也没权替学生决定这段对话要不要保留。
    const chatResetMask = document.getElementById("chatResetMask");
    const greetEl = log.querySelector(".msg.bot");   // 开场白那条，清完得留着

    function chatMsgCount() {
      const n = log.querySelectorAll(".msg").length;
      return greetEl ? Math.max(0, n - 1) : n;       // 减去开场白
    }

    function openChatReset() {
      const n = chatMsgCount();
      document.getElementById("chatResetSummary").innerHTML =
        `当前这段对话里有 <b>${n} 条</b>消息。` +
        (n <= 0
          ? "现在还只有开场白，暂时没什么可清的。"
          : "清空之后它们就都消失了，找不回来。");
      chatResetMask.classList.add("show");
      document.getElementById("chatResetCancel").focus();
    }

    function closeChatReset() { chatResetMask.classList.remove("show"); }

    async function doClearChat() {
      try {
        const r = await fetch("/api/chat/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId() }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || d.ok === false) {
          addMsg(botName(), "清空没成功，聊天记录原样保留，请再试一次。", "bot");
          closeChatReset();
          return;
        }
        // 服务器上那段历史已经没了，屏幕上也要回到"刚打开页面"的样子
        if (greetEl) {
          Array.from(log.children).forEach(el => { if (el !== greetEl) el.remove(); });
        }
        // 最关键的一步：换一个新的 session id。
        // 不换的话，学生一按 F5，restoreHistory 又把旧记录一条条捞回来了，
        // 清了跟没清一个样——这正是"刷新后记录又冒出来"的老毛病。
        localStorage.setItem("campustime_session",
          "s" + Math.random().toString(16).slice(2, 12));
        addMsg(botName(), "好的，我们已经开始一段新的对话，之前那段记录我帮你清掉了。", "bot");
        await loadScheduleView();          // 课表/日程不受影响，顺手确认一下还在
      } catch (e) {
        addMsg(botName(), "清空没成功，聊天记录原样保留，请再试一次。", "bot");
      }
      closeChatReset();
    }

    document.getElementById("clearChat").addEventListener("click", openChatReset);
    document.getElementById("chatResetCancel").addEventListener("click", closeChatReset);
    document.getElementById("chatResetOk").addEventListener("click", doClearChat);
    chatResetMask.addEventListener("click", e => {
      if (e.target === chatResetMask) closeChatReset();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && chatResetMask.classList.contains("show")) closeChatReset();
    });

    // 初始化语音输入
    initVoice();
    // 拉回上次的聊天记录（异步，不影响开场白先显示出来）
    restoreHistory();
  </script>
</body>
</html>
