<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园时间管家 · 学生端</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fb; color: #1f2733;
    }
    header {
      background: linear-gradient(135deg, #4f7cff, #6a5cff);
      color: #fff; padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .9; font-size: 13px; }
    .wrap { max-width: 900px; margin: 18px auto; padding: 0 16px; }

    /* 四个模块导航卡片 */
    .modules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .mod {
      background: #fff; border: 2px solid #e6eaf5; border-radius: 14px;
      padding: 14px 10px; text-align: center; cursor: pointer; transition: .15s;
    }
    .mod:hover { transform: translateY(-2px); border-color: #4f7cff; }
    .mod.active { border-color: #4f7cff; background: #eef2ff; }
    .mod .ico { font-size: 26px; }
    .mod .nm { margin-top: 6px; font-size: 14px; font-weight: 600; }

    /* 校园通知：管理员在后台发布，学生在这里看到 */
    .notices {
      background: #fff; border-radius: 12px; margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(40,60,120,.08); overflow: hidden;
    }
    .notices-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .badge { background: #ff5c8a; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
    .notice-item { border-top: 1px solid #eef0f6; padding: 10px 16px; }
    .notice-item b { font-size: 14px; }
    .notice-item .body { font-size: 13px; color: #4a5366; margin-top: 4px; white-space: pre-wrap; }

    .hint { font-size: 13px; color: #6a7388; margin: 12px 2px 6px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; min-height: 4px; }
    .chip {
      background: #fff; border: 1px solid #d8def0; border-radius: 16px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: #4f7cff;
    }
    .chip:hover { background: #eef2ff; }

    #log {
      background: #fff; border-radius: 12px; padding: 16px;
      min-height: 300px; max-height: 440px; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(40,60,120,.08);
    }
    .msg { margin: 10px 0; }
    .msg .who { font-size: 12px; color: #8a93a6; margin-bottom: 3px; }
    .msg .bubble {
      display: inline-block; padding: 10px 14px; border-radius: 12px;
      line-height: 1.55; white-space: pre-wrap; max-width: 92%;
    }
    .user .bubble { background: #4f7cff; color: #fff; border-bottom-right-radius: 2px; }
    .bot .bubble { background: #f0f3fa; color: #1f2733; border-bottom-left-radius: 2px; }
    .sys .bubble { background: #fff7e6; color: #8a6d3b; border: 1px dashed #ffd591; font-size: 13px; }
    .trace {
      margin-top: 6px; font-size: 12px; color: #6a7388;
      background: #fafbff; border: 1px dashed #d8def0; border-radius: 8px;
      padding: 8px 10px; white-space: pre-wrap;
    }
    .inputbar { display: flex; gap: 10px; margin-top: 14px; }
    .inputbar input {
      flex: 1; padding: 12px 14px; border: 1px solid #d8def0; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    .inputbar button {
      padding: 0 22px; border: none; border-radius: 10px; cursor: pointer;
      background: #4f7cff; color: #fff; font-size: 14px;
    }
    .inputbar button:disabled { opacity: .6; cursor: not-allowed; }
    /* 回形针：上传资料给管家读 */
    .attach {
      padding: 0 14px; border: 1px solid #d8def0; background: #fff; color: #4f7cff;
      border-radius: 10px; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .attach:hover { background: #eef2ff; }
    .tag { display:inline-block; font-size:11px; background:#eef2ff; color:#4f7cff; border-radius:6px; padding:1px 6px; margin-left:6px;}
    @media (max-width: 600px) { .modules { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>校园时间管家 · 学生端 <a href="/" style="font-size:13px;color:#fff;float:right;opacity:.9;text-decoration:none;">← 返回登录</a></h1>
    <p>一个入口办四件事：课表安排 · 校园问答 · 快递 · 外卖</p>
    <a href="/plan" style="float:right;margin-top:-26px;color:#fff;font-size:13px;opacity:.95;text-decoration:none;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:8px;">📅 我的日程 →</a>
  </header>

  <div class="wrap">
    <!-- 校园通知（管理员在控制台发布，含附件可直接下载） -->
    <div class="notices">
      <div class="notices-head" id="noticesHead">
        <span>📢 校园通知</span>
        <span class="badge" id="noticeCount">0</span>
        <span class="small" id="noticesToggle" style="margin-left:auto;color:#8a93a6;font-weight:400;">展开 ▾</span>
      </div>
      <div id="noticeList" style="display:none;"></div>
    </div>

    <!-- 四个模块导航 -->
    <div class="modules" id="modules"></div>
    <div class="hint" id="hint">点上面的模块进入对应助手，或直接提问（我会自动识别意图）。</div>
    <div class="chips" id="chips"></div>

    <div id="log">
      <div class="msg bot">
        <div class="who">管家</div>
        <div class="bubble">你好，我是你的校园时间管家 👋 选一个模块开始，或直接说需求（比如"我有哪些快递待取？"）。</div>
      </div>
    </div>

    <div class="inputbar">
      <input type="file" id="file" style="display:none;" />
      <button class="attach" id="attach" title="上传资料给管家读">📎</button>
      <input id="text" placeholder="说点什么…" />
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    // 四个模块的配置：名字、图标、示例问题
    const MODULES = {
      schedule: { name: "课表安排", ico: "🗓️", chips: ["我这周哪天有空复习高数？", "周三都有什么课？", "帮我排 3 小时复习线代，优先周二", "周五下午有空吗？"] },
      faq:      { name: "校园问答", ico: "❓", chips: ["图书馆几点关门？", "宿舍几点断电？", "校车在哪坐？", "怎么申请奖学金？"] },
      express:  { name: "快递",     ico: "📦", chips: ["我有哪些快递待取？", "取件码 B-5678 是什么？", "有没有滞留的快递？", "列出我所有快递"] },
      takeout:  { name: "外卖",     ico: "🍱", chips: ["我的外卖到哪了？", "有哪些待取的外卖？", "订单 T1 什么状态？", "去哪取我的外卖？"] },
    };

    let currentModule = null; // 当前选中的模块；null 表示让后端自动识别

    const log = document.getElementById("log");
    const text = document.getElementById("text");
    const send = document.getElementById("send");
    const chipsBox = document.getElementById("chips");
    const hint = document.getElementById("hint");

    // 渲染四个模块卡片
    const modBox = document.getElementById("modules");
    Object.entries(MODULES).forEach(([key, m]) => {
      const el = document.createElement("div");
      el.className = "mod";
      el.dataset.key = key;
      el.innerHTML = `<div class="ico">${m.ico}</div><div class="nm">${m.name}</div>`;
      el.addEventListener("click", () => selectModule(key));
      modBox.appendChild(el);
    });

    function selectModule(key) {
      currentModule = key;
      // 高亮当前卡片
      document.querySelectorAll(".mod").forEach(d => d.classList.toggle("active", d.dataset.key === key));
      hint.textContent = `已进入【${MODULES[key].name}】模块，问我吧～`;
      // 渲染该模块的示例问题
      chipsBox.innerHTML = "";
      MODULES[key].chips.forEach(q => {
        const c = document.createElement("div");
        c.className = "chip";
        c.textContent = q;
        c.addEventListener("click", () => sendMsg(q));
        chipsBox.appendChild(c);
      });
      addMsg("系统", `已切换到【${MODULES[key].name}】模块`, "sys");
    }

    function addMsg(who, content, kind, trace, module) {
      const el = document.createElement("div");
      el.className = "msg " + (kind === "sys" ? "sys" : (who === "我" ? "user" : "bot"));
      let html = `<div class="who">${who}${module ? `<span class="tag">${module}</span>` : ""}</div>`;
      html += `<div class="bubble">${escapeHtml(content)}</div>`;
      if (trace && trace.length) {
        const lines = trace.map(t => {
          if (t.action) return `${t.phase || ""} ${t.action}(${JSON.stringify(t.args || {})})`;
          if (t.answer) return `${t.phase || ""} ${t.answer}`;
          return t.phase || "";
        }).join("\n");
        html += `<div class="trace">🧠 Agent 思考轨迹：\n${escapeHtml(lines)}</div>`;
      }
      el.innerHTML = html;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    // 会话 id：和日程页共用同一个，后端靠它把几轮对话串起来，
    // 这样 AI 才记得住上一轮跟我们商量好的时间安排
    function sessionId() {
      let sid = localStorage.getItem("campustime_session");
      if (!sid) { sid = "s" + Math.random().toString(16).slice(2, 12); localStorage.setItem("campustime_session", sid); }
      return sid;
    }

    async function sendMsg(msg) {
      if (!msg.trim()) return;
      addMsg("我", msg);
      text.value = "";
      send.disabled = true;
      try {
        const body = { message: msg, session_id: sessionId() };
        if (currentModule) body.module = currentModule; // 显式锁定模块
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (data.error) addMsg("管家", "出错了：" + data.error);
        else {
          addMsg("管家", data.answer, "bot", data.trace, data.module);
          logToAdmin(msg, data.module, data.answer); // 上报给管理员收件箱
        }
      } catch (e) {
        addMsg("管家", "网络或接口异常：" + e.message);
      } finally {
        send.disabled = false;
      }
    }

    // 把学生这轮对话上报给管理员收件箱（异步、失败也不影响学生使用）
    function logToAdmin(message, module, answer) {
      fetch("/api/student-message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, module, answer }),
      }).catch(() => {});
    }

    // ---------- 校园通知（管理员发布，学生看到，含附件可下载） ----------
    // 这条链路补齐了「管理员发布 → 学生接收」的最后一段闭环
    let noticesOpen = false;
    async function loadNotices() {
      const box = document.getElementById("noticeList");
      try {
        const ns = (await (await fetch("/api/notices")).json()).notices || [];
        document.getElementById("noticeCount").textContent = ns.length;
        if (!ns.length) {
          box.innerHTML = '<div class="notice-item"><span class="small">暂无通知</span></div>';
          return;
        }
        box.innerHTML = ns.map(n => {
          const att = n.attachment
            ? `<div style="margin-top:6px;"><a class="chip" style="display:inline-block;text-decoration:none;" href="/api/uploads/${n.attachment.id}/download" target="_blank">📎 ${escapeHtml(n.attachment.name)}（下载）</a></div>`
            : "";
          return `<div class="notice-item">
            <b>${escapeHtml(n.title || "(无标题)")}</b> <span class="small">${n.ts}</span>
            <div class="body">${escapeHtml(n.content)}</div>${att}
          </div>`;
        }).join("");
      } catch (e) {
        box.innerHTML = '<div class="notice-item"><span class="small">通知加载失败</span></div>';
      }
    }
    document.getElementById("noticesHead").addEventListener("click", () => {
      noticesOpen = !noticesOpen;
      document.getElementById("noticeList").style.display = noticesOpen ? "block" : "none";
      document.getElementById("noticesToggle").textContent = noticesOpen ? "收起 ▴" : "展开 ▾";
    });

    // ---------- 上传资料给管家读 ----------
    // 流程：选文件 → POST /api/upload 存起来 → 管家之后就能用工具读到它的真实内容
    const fileInput = document.getElementById("file");
    document.getElementById("attach").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", handleFile);

    async function handleFile() {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      addMsg("我", `📎 上传了资料：${f.name}`, "user");
      const form = new FormData();
      form.append("file", f);
      try {
        const r = await fetch("/api/upload", { method: "POST", body: form });
        const d = await r.json();
        if (d.ok) {
          // 上传完给几个常见问题，让用户零思考就能用起来
          addMsg("系统", `《${f.name}》已就位（${d.file.chars} 字）。现在可以直接问它里面的内容了 —— 我会先读文件再回答，不会瞎编。`, "sys");
          chipsBox.innerHTML = "";
          ["这份资料讲了什么？", "帮我提炼重点", "里面有哪些需要注意的时间安排？"].forEach(q => {
            const c = document.createElement("div");
            c.className = "chip";
            c.textContent = q;
            c.addEventListener("click", () => sendMsg(q));
            chipsBox.appendChild(c);
          });
        } else {
          addMsg("系统", "上传失败：" + (d.error || "未知原因"), "sys");
        }
      } catch (e) {
        addMsg("系统", "上传异常：" + e.message, "sys");
      }
      fileInput.value = ""; // 清空，方便同一个文件再次上传触发 change
    }

    send.addEventListener("click", () => sendMsg(text.value));
    text.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(text.value); });

    // 进页面拉一次通知，之后每 30 秒刷新（管理员新发的通知会自己冒出来）
    loadNotices();
    setInterval(loadNotices, 30000);
  </script>
</body>
</html>
