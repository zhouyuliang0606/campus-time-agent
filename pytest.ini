# pytest 的配置：这个项目的自检入口是 `python tests/run_all.py`，不是 pytest。
# 装了 pytest 的人习惯敲 `pytest`，所以给它一道门，收**且只收**那一份文件
# （其余 44 份 `test_*.py` 是自跑脚本，三份还在模块层 sys.exit —— 一 import 就 INTERNALERROR；
#  就算不崩也不该同进程连跑，数据目录是启动时定下来的，批次之间会串味。详见 tests/pytest_gate.py）。
[pytest]
testpaths = tests
python_files = pytest_gate.py
